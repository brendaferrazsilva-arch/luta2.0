            bodyG.addColorStop(0, '#222230');
            bodyG.addColorStop(0.5, '#14141c');
            bodyG.addColorStop(1, '#0c0c12');
            ctx.fillStyle = bodyG;
            rr(x + 8, y + 22 + breath, w - 16, 30, 4);
            // diagonal wrap

            ctx.moveTo(x + 10, y + 24 + breath);

            ctx.lineTo(x + w - 9, y + 44 + breath);

            // ----- OBI + pouches -----

            rr(x + 7, y + 46 + breath, w - 14, 7, 2);

            ctx.fillRect(x + 7, y + 47 + breath, w - 14, 1.5);

            rr(x + 10, y + 48 + breath, 6, 8, 1);
            ctx.fillStyle = '#6a6a72';
            ctx.fillRect(x + 12.2, y + 49 + breath, 1.4, 5);
            // shuriken on hip
            ctx.save();
            ctx.translate(x + w - 13, y + 51 + breath);
            ctx.rotate(frameCount * 0.01);
            ctx.fillStyle = '#8a8a94';
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);

                ctx.lineTo(-1.2, -5);
                ctx.lineTo(1.2, -5);
            }
            ctx.fill();
            ctx.restore();

            // ----- BACK ARM -----
            ctx.fillStyle = '#12121a';
            rr(x + 3, y + 24 + breath, 6, 18, 3);
            ctx.fillStyle = '#2a1014';
            rr(x + 2.5, y + 30 + breath, 7, 5, 2);
            ctx.fillStyle = '#1a1a22';
            ellipse(x + 6, y + 44 + breath, 5.5, 5.5);

            // ----- FRONT ARM + bracer -----
            const armX = x + w - 10 + punch;
            ctx.fillStyle = '#12121a';
            rr(armX, y + 20 + breath, 8, 20, 3);
            // armored bracer
            ctx.fillStyle = '#2a2a36';
            rr(armX - 1, y + 28 + breath, 10, 10, 2);
            ctx.strokeStyle = '#6a1820';
            ctx.lineWidth = 1;
            ctx.strokeRect(armX, y + 30 + breath, 8, 6);
            ctx.fillStyle = '#8b1a22';
            ctx.fillRect(armX + 1, y + 32 + breath, 6, 1.2);
            // hidden blade ridge
            ctx.fillStyle = '#9aa0aa';
            ctx.fillRect(armX + 8, y + 31 + breath, 2, 7);

            // front fist wrap
            const gx = x + w - 3 + punch;
            const gy = y + 28 + breath + (f.punching ? -4 : 0);
            ctx.fillStyle = '#1a1a24';
            ellipse(gx, gy, 10, 9);
            ctx.fillStyle = '#5a1218';
            ellipse(gx, gy, 7, 6);
            ctx.strokeStyle = '#8a8a94';
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.arc(gx, gy, 6, 0.2, 1.4);
            ctx.stroke();

            // ----- SCARF -----
            ctx.fillStyle = '#7a1520';
            ctx.beginPath();
            ctx.moveTo(x + 12, y + 22 + breath);
            ctx.quadraticCurveTo(x - 2 + sway, y + 36 + breath, x + 6 + sway, y + 48 + breath);
            ctx.quadraticCurveTo(x + 10 + sway, y + 40, x + 14, y + 28 + breath);
            ctx.fill();
            ctx.fillStyle = '#4a0e14';
            ctx.beginPath();
            ctx.moveTo(x + 14, y + 23 + breath);
            ctx.quadraticCurveTo(x + 2 + sway, y + 42, x + 8 + sway * 0.5, y + 54);
            ctx.quadraticCurveTo(x + 12, y + 44, x + 16, y + 26 + breath);
            ctx.fill();

            // ----- NECK / MASK base -----
            ctx.fillStyle = '#0e0e14';
            rr(cx - 6, y + 18 + breath, 12, 8, 3);

            // ----- HEAD + HOOD -----
            ctx.fillStyle = '#14141c';
            ellipse(cx, y + 13 + breath, 15.5, 17);
            // hood
            ctx.fillStyle = '#0a0a10';
            ctx.beginPath();
            ctx.moveTo(cx - 16, y + 16 + breath);
            ctx.quadraticCurveTo(cx - 18, y + 2 + breath, cx, y - 2 + breath);
            ctx.quadraticCurveTo(cx + 18, y + 2 + breath, cx + 16, y + 16 + breath);
            ctx.quadraticCurveTo(cx, y + 8 + breath, cx - 16, y + 16 + breath);
            ctx.fill();
            // hood peak
            ctx.fillStyle = '#12121a';
            ctx.beginPath();
            ctx.moveTo(cx - 4, y + 1 + breath);
            ctx.lineTo(cx, y - 6 + breath);
            ctx.lineTo(cx + 4, y + 1 + breath);
            ctx.closePath();
            ctx.fill();

            // face mask
            ctx.fillStyle = '#1a1a24';
            ctx.beginPath();
            ctx.ellipse(cx + 2, y + 18 + breath, 13, 9, 0, 0.15, Math.PI - 0.15);
            ctx.fill();
            // mask seams
            ctx.strokeStyle = 'rgba(120,30,40,0.4)';
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(cx - 6, y + 17 + breath); ctx.lineTo(cx + 12, y + 20 + breath);
            ctx.stroke();

            // visible eye slit
            ctx.fillStyle = '#0a0a0a';
            rr(cx + 1, y + 11.5 + breath + (hurt ? 1 : 0), 11, 5, 2);
            const eyeX = cx + 7, eyeY = y + 14 + breath + (hurt ? 1 : 0);
            ctx.fillStyle = hurt ? '#ff4455' : '#e8f4ff';
            ellipse(eyeX, eyeY, 3.4, 2.2);
            ctx.fillStyle = hurt ? '#6b0000' : '#1a2030';
            ellipse(eyeX + 0.8, eyeY, 1.8, 1.8);
            ctx.fillStyle = '#7ecbff';
            ellipse(eyeX + 1.4, eyeY - 0.6, 0.7, 0.7);

            // brow wrap
            ctx.fillStyle = '#12121a';
            ctx.fillRect(cx - 12, y + 8 + breath, 26, 3.5);
            ctx.fillStyle = '#6a1520';
            ctx.fillRect(cx - 12, y + 9 + breath, 26, 1);
        }

        // ============================================================
        // SAMURAI — layered o-yoroi, kabuto, menpo, katana
        // ============================================================
        function drawSamurai(f, x, y, w, h, breath) {
            const punch = f.punching ? 14 : 0;
            const jump = f.isJumping ? 2 : 0;
            const hurt = f.expression === 'hurt';
            const cx = x + w / 2;

            // ----- SUNEATE / boots -----
            ctx.fillStyle = '#2a1a12';
            rr(x + 6, y + 66 + jump, 12, 8, 2);
            rr(x + w - 17, y + 66 + jump, 12, 8, 2);
            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(x + 7, y + 67 + jump, 10, 1.5);
            ctx.fillRect(x + w - 16, y + 67 + jump, 10, 1.5);
            ctx.fillStyle = '#3a2418';
            ctx.fillRect(x + 8, y + 70 + jump, 8, 3);
            ctx.fillRect(x + w - 15, y + 70 + jump, 8, 3);

            // ----- HAKAMA -----
            const hak = ctx.createLinearGradient(x, y + 50, x, y + 70);
            hak.addColorStop(0, '#4a1010');
            hak.addColorStop(1, '#1a0808');
            ctx.fillStyle = hak;
            ctx.beginPath();
            ctx.moveTo(x + 7, y + 50);
            ctx.lineTo(x + 3, y + 68 + jump);
            ctx.lineTo(x + 19, y + 68 + jump);
            ctx.lineTo(cx, y + 52);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx, y + 52);
            ctx.lineTo(x + w - 19, y + 68 + jump);
            ctx.lineTo(x + w - 3, y + 68 + jump);
            ctx.lineTo(x + w - 7, y + 50);
            ctx.fill();
            ctx.strokeStyle = 'rgba(201,168,76,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 52); ctx.lineTo(x + 8, y + 66);
            ctx.moveTo(x + w - 10, y + 52); ctx.lineTo(x + w - 8, y + 66);
            ctx.stroke();

            // ----- KATANA on hip (visual) -----
            ctx.save();
            ctx.translate(x + 6, y + 44 + breath);
            ctx.rotate(-0.7);
            ctx.fillStyle = '#1a1208';
            rr(-2, 0, 5, 28, 1);
            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(-1.5, 0, 4, 3);
            ctx.fillStyle = '#d8d0c0';
            ctx.fillRect(-0.7, 3, 2.2, 22);
            ctx.restore();

            // ----- DO (chest armor) -----
            const doG = ctx.createLinearGradient(x + 6, y + 24, x + w - 6, y + 52);
            doG.addColorStop(0, '#8b2424');
            doG.addColorStop(0.5, '#5a1212');
            doG.addColorStop(1, '#3a0a0a');
            ctx.fillStyle = doG;
            rr(x + 7, y + 24 + breath, w - 14, 28, 3);
            // lacquer plates
            ctx.strokeStyle = 'rgba(201,168,76,0.45)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(x + 9, y + 30 + breath + i * 5.2);
                ctx.lineTo(x + w - 9, y + 30 + breath + i * 5.2);
                ctx.stroke();
            }
            // odoshi lacing
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < 3; i++) {
                const lx = x + 13 + i * 7;
                ctx.beginPath();
                ctx.moveTo(lx, y + 28 + breath);
                ctx.lineTo(lx + 2, y + 32 + breath);
                ctx.lineTo(lx, y + 36 + breath);
                ctx.lineTo(lx + 2, y + 40 + breath);
                ctx.stroke();
            }
            // mon crest
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(cx, y + 32 + breath, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#5a1212';
            ctx.beginPath();
            ctx.arc(cx, y + 32 + breath, 1.6, 0, Math.PI * 2);
            ctx.fill();

            // ----- SODE (shoulder guards) — wide silhouette -----
            ctx.fillStyle = '#4a1010';
            ctx.beginPath();
            ctx.moveTo(x + 2, y + 24 + breath);
            ctx.lineTo(x - 4, y + 28 + breath);
            ctx.lineTo(x - 2, y + 38 + breath);
            ctx.lineTo(x + 8, y + 34 + breath);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#6b1a1a';
            ctx.beginPath();
            ctx.moveTo(x + w - 2, y + 24 + breath);
            ctx.lineTo(x + w + 5, y + 26 + breath);
            ctx.lineTo(x + w + 4, y + 36 + breath);
            ctx.lineTo(x + w - 8, y + 34 + breath);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 3, y + 30 + breath); ctx.lineTo(x + 6, y + 28 + breath);
            ctx.moveTo(x + w + 3, y + 30 + breath); ctx.lineTo(x + w - 6, y + 28 + breath);
            ctx.stroke();

            // ----- KOTE arms -----
            ctx.fillStyle = '#3a0e0e';
            rr(x + 2, y + 28 + breath, 7, 16, 2);
            const armX = x + w - 9 + punch;
            ctx.fillStyle = '#4a1414';
            rr(armX, y + 22 + breath, 9, 18, 2);
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 0.8;
            ctx.strokeRect(armX + 1, y + 26 + breath, 7, 8);
            // gauntlet
            const gx = x + w - 1 + punch;
            const gy = y + 28 + breath + (f.punching ? -4 : 0);
            const gg = ctx.createRadialGradient(gx - 4, gy - 4, 2, gx, gy, 12);
            gg.addColorStop(0, '#e0c86a');
            gg.addColorStop(0.5, '#c9a84c');
            gg.addColorStop(1, '#8a6a28');
            ctx.fillStyle = gg;
            ellipse(gx, gy, 11, 10);
            ctx.fillStyle = '#5a1212';
            ellipse(gx + 1, gy, 5, 4);

            // ----- OBI -----
            ctx.fillStyle = '#c9a84c';
            rr(x + 8, y + 48 + breath, w - 16, 5, 1);
            ctx.fillStyle = '#8a6a20';
            ctx.fillRect(cx - 4, y + 48.5 + breath, 8, 4);

            // ----- NECK GUARD -----
            ctx.fillStyle = '#3a0e0e';
            rr(cx - 7, y + 18 + breath, 14, 8, 2);
            ctx.strokeStyle = '#c9a84c';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(cx - 6, y + 21 + breath); ctx.lineTo(cx + 6, y + 21 + breath);
            ctx.stroke();

            // ----- MENPO + FACE -----
            ctx.fillStyle = '#e8c9a0';
            ellipse(cx, y + 14 + breath, 13, 14);
            // menpo lower mask
            ctx.fillStyle = '#4a3a2a';
            ctx.beginPath();
            ctx.moveTo(cx - 11, y + 16 + breath);
            ctx.quadraticCurveTo(cx, y + 28 + breath, cx + 12, y + 16 + breath);
            ctx.quadraticCurveTo(cx + 4, y + 18 + breath, cx, y + 17 + breath);
            ctx.quadraticCurveTo(cx - 4, y + 18 + breath, cx - 11, y + 16 + breath);
            ctx.fill();
            // teeth ridge
            ctx.fillStyle = '#d8d0c0';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(cx - 6 + i * 3, y + 19 + breath, 2, 2.4);
            }

            // eyes fierce
            const eyeX = cx + 6, eyeY = y + 13 + breath + (hurt ? 1 : 0);
            ctx.fillStyle = '#f8fbff';
            ellipse(eyeX, eyeY, 4.2, 3.2);
            ctx.fillStyle = hurt ? '#6b0000' : '#1a0a0a';
            ellipse(eyeX + 1.1, eyeY, 2.3, 2.3);
            ctx.fillStyle = '#fff';
            ellipse(eyeX + 1.8, eyeY - 1, 0.9, 0.9);
            ctx.strokeStyle = '#1a0a0a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(eyeX - 5, y + 10 + breath);
            ctx.lineTo(eyeX + 5, y + 9.5 + breath);
            ctx.stroke();

            // ----- KABUTO -----
            ctx.fillStyle = '#3a1010';
            ctx.beginPath();
            ctx.ellipse(cx, y + 6 + breath, 17, 11, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#5a1818';
            ctx.beginPath();
            ctx.ellipse(cx, y + 5 + breath, 14, 8, 0, Math.PI, 0);
            ctx.fill();
            // maedate crest
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx - 10, y + 2 + breath);
            ctx.quadraticCurveTo(cx - 14, y - 10 + breath, cx - 4, y - 8 + breath);
            ctx.moveTo(cx + 10, y + 2 + breath);
            ctx.quadraticCurveTo(cx + 14, y - 10 + breath, cx + 4, y - 8 + breath);
            ctx.stroke();
            ctx.fillStyle = '#f1c40f';
            ellipse(cx, y + 1 + breath, 2.2, 2.2);
            // shikoro neck plates
            ctx.fillStyle = '#4a1414';
            ctx.beginPath();
            ctx.moveTo(cx - 16, y + 10 + breath);
            ctx.lineTo(cx - 18, y + 18 + breath);
            ctx.lineTo(cx - 10, y + 16 + breath);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx + 16, y + 10 + breath);
            ctx.lineTo(cx + 18, y + 18 + breath);
            ctx.lineTo(cx + 10, y + 16 + breath);
            ctx.fill();
        }

        // ============================================================
        // LUTADOR — Muay Thai / MMA veteran, unique vs boxer
        // ============================================================
        function drawLutador(f, x, y, w, h, breath) {
            const punch = f.punching ? 15 : 0;
            const jump = f.isJumping ? 3 : 0;
            const hurt = f.expression === 'hurt';
            const skin = f.skin;
            const cx = x + w / 2;

            // ----- BAREFOOT / fight shoes low -----
            ctx.fillStyle = '#2a1810';
            rr(x + 6, y + 70 + jump, 12, 4.5, 2);
            rr(x + w - 17, y + 70 + jump, 12, 4.5, 2);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(x + 7, y + 70.5 + jump, 10, 1.2);
            ctx.fillRect(x + w - 16, y + 70.5 + jump, 10, 1.2);

            // ----- SHINS + knee wraps -----
            ctx.fillStyle = skin.head;
            rr(x + 8, y + 56 + jump, 10, 15 - jump, 3);
            rr(x + w - 18, y + 56 + jump, 10, 15 - jump, 3);
            ctx.fillStyle = '#d8c8b0';
            rr(x + 7, y + 60 + jump, 12, 7, 2);
            rr(x + w - 19, y + 60 + jump, 12, 7, 2);
            ctx.strokeStyle = 'rgba(80,50,30,0.35)';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(x + 8, y + 61.5 + jump + i * 1.8);
                ctx.lineTo(x + 18, y + 61.5 + jump + i * 1.8);
                ctx.stroke();
            }

            // ----- MUAY THAI SHORTS -----
            const sh = ctx.createLinearGradient(x, y + 44, x, y + 62);
            sh.addColorStop(0, '#8b1a12');
            sh.addColorStop(0.5, '#5a100c');
            sh.addColorStop(1, '#3a0a08');
            ctx.fillStyle = sh;
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 46 + breath * 0.2);
            ctx.lineTo(x + 3, y + 62);
            ctx.lineTo(x + 18, y + 60);
            ctx.lineTo(cx, y + 50);
            ctx.lineTo(x + w - 18, y + 60);
            ctx.lineTo(x + w - 3, y + 62);
            ctx.lineTo(x + w - 5, y + 46 + breath * 0.2);
            ctx.closePath();
            ctx.fill();
            // ornate side panel
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 48);
            ctx.lineTo(x + 4, y + 60);
            ctx.lineTo(x + 10, y + 58);
            ctx.lineTo(x + 9, y + 48);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + w - 5, y + 48);
            ctx.lineTo(x + w - 4, y + 60);
            ctx.lineTo(x + w - 10, y + 58);
            ctx.lineTo(x + w - 9, y + 48);
            ctx.fill();
            // waist
            ctx.fillStyle = '#1a1a1a';
            rr(x + 6, y + 45 + breath * 0.2, w - 12, 4, 2);
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(x + 7, y + 46.2 + breath * 0.2, w - 14, 1.4);

            // ----- TORSO (compact, powerful) -----
            const bodyG = ctx.createLinearGradient(x + 7, y + 22, x + w - 7, y + 48);
            bodyG.addColorStop(0, lightenColor(skin.head, 8));
            bodyG.addColorStop(0.5, skin.head);
            bodyG.addColorStop(1, darkenColor(skin.head, 16));
            ctx.fillStyle = bodyG;
            rr(x + 7, y + 22 + breath, w - 14, 26, 5);
            // thicker build
            ctx.fillStyle = 'rgba(90,45,20,0.14)';
            ellipse(cx - 7, y + 32 + breath, 7, 4);
            ellipse(cx + 7, y + 32 + breath, 7, 4);
            // tribal-like chest mark (tasteful geometric)
            ctx.strokeStyle = 'rgba(60,30,15,0.28)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx, y + 28 + breath);
            ctx.lineTo(cx - 5, y + 36 + breath);
            ctx.lineTo(cx, y + 42 + breath);
            ctx.lineTo(cx + 5, y + 36 + breath);
            ctx.closePath();
            ctx.stroke();

            // ----- PRA JIAD arm bands -----
            ctx.fillStyle = skin.head;
            rr(x + 2, y + 24 + breath, 7, 18, 3);
            ctx.fillStyle = '#c0392b';
            rr(x + 1.5, y + 28 + breath, 8, 6, 2);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(x + 2, y + 30 + breath, 7, 1.5);
            ctx.fillStyle = '#1a1a1a';
            ellipse(x + 5.5, y + 44 + breath, 6, 5.5);

            const armX = x + w - 10 + punch;
            ctx.fillStyle = skin.head;
            rr(armX, y + 20 + breath, 9, 20, 3);
            ctx.fillStyle = '#c0392b';
            rr(armX - 1, y + 26 + breath, 11, 7, 2);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(armX, y + 28 + breath, 9, 1.6);
            ctx.fillStyle = '#e8d5b0';
            rr(armX - 1, y + 36 + breath, 11, 8, 2);
            ctx.strokeStyle = 'rgba(80,50,30,0.4)';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(armX, y + 37.5 + breath + i * 1.6);
                ctx.lineTo(armX + 9, y + 37.5 + breath + i * 1.6);
                ctx.stroke();
            }

            // MMA-style glove (smaller, segmented)
            const gx = x + w - 2 + punch;
            const gy = y + 28 + breath + (f.punching ? -4 : 0);
            const gg = ctx.createRadialGradient(gx - 4, gy - 4, 2, gx, gy, 12);
            gg.addColorStop(0, '#e74c3c');
            gg.addColorStop(0.5, '#c0392b');
            gg.addColorStop(1, '#7a1c16');
            ctx.fillStyle = gg;
            ellipse(gx, gy, 11, 10);
            ctx.fillStyle = '#1a1a1a';
            rr(gx - 7, gy + 5, 12, 5, 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ellipse(gx - 3, gy - 1, 2.2, 3.5);
            ellipse(gx + 1, gy - 1, 2.2, 3.5);
            ellipse(gx + 5, gy - 1, 2, 3.2);

            // ----- NECK -----
            ctx.fillStyle = darkenColor(skin.head, 10);
            rr(cx - 6, y + 19 + breath, 12, 7, 3);

            // ----- HEAD (shaved sides, top knot, stubble, cauliflower ear) -----
            const hg = ctx.createRadialGradient(cx - 4, y + 8 + breath, 3, cx, y + 13 + breath, 17);
            hg.addColorStop(0, lightenColor(skin.head, 20));
            hg.addColorStop(0.7, skin.head);
            hg.addColorStop(1, darkenColor(skin.head, 12));
            ctx.fillStyle = hg;
            ellipse(cx, y + 13 + breath, 16.5, 17.5);

            // cauliflower ear
            ctx.fillStyle = darkenColor(skin.head, 8);
            ellipse(cx - 16, y + 15 + breath, 3.5, 5.5);
            ctx.strokeStyle = 'rgba(80,40,30,0.35)';
            ctx.lineWidth = 0.8;
            strokeEllipse(cx - 16, y + 15 + breath, 2, 3.5);

            // buzzed sides
            ctx.fillStyle = 'rgba(40,22,12,0.45)';
            ellipse(cx - 13, y + 10 + breath, 4, 8);
            ellipse(cx + 13, y + 10 + breath, 4, 8);
            // top hair + knot
            ctx.fillStyle = '#2a160c';
            ctx.beginPath();
            ctx.ellipse(cx, y + 4 + breath, 10, 6, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#1a0e08';
            ellipse(cx + 1, y - 1 + breath, 4, 4);
            ctx.fillStyle = '#3a2010';
            ellipse(cx + 1, y - 4 + breath, 3.2, 3.2);

            // hachimaki
            ctx.fillStyle = '#8b1a12';
            ctx.fillRect(cx - 15, y + 7 + breath, 30, 3.4);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(cx - 15, y + 8 + breath, 30, 1.1);
            // knot tail
            ctx.fillStyle = '#8b1a12';
            ctx.beginPath();
            ctx.moveTo(cx - 15, y + 8 + breath);
            ctx.lineTo(cx - 20, y + 16 + breath);
            ctx.lineTo(cx - 13, y + 10 + breath);
            ctx.fill();

            // thick brows
            ctx.strokeStyle = hurt ? '#6b0000' : '#1a0e08';
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + 2, y + 10.5 + breath);
            ctx.lineTo(cx + 12, y + 10 + breath);
            ctx.stroke();

            const eyeX = cx + 7, eyeY = y + 14.5 + breath + (hurt ? 1 : 0);
            ctx.fillStyle = '#f8fbff';
            ellipse(eyeX, eyeY, 4.8, 4);
            ctx.fillStyle = hurt ? '#6b0000' : '#2a1810';
            ellipse(eyeX + 1.3, eyeY, 2.7, 2.7);
            ctx.fillStyle = '#fff';
            ellipse(eyeX + 2.1, eyeY - 1.3, 1.1, 1.1);

            // broken-nose hint
            ctx.strokeStyle = 'rgba(90,50,30,0.4)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(cx + 2, y + 15 + breath);
            ctx.lineTo(cx + 4.5, y + 19 + breath);
            ctx.lineTo(cx + 6, y + 18.5 + breath);
            ctx.stroke();

            // stubble
            ctx.fillStyle = 'rgba(40,22,12,0.28)';
            ellipse(cx + 2, y + 22 + breath, 8, 4);
            // mouth
            ctx.strokeStyle = 'rgba(80,40,30,0.55)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            if (hurt) ctx.arc(cx + 3, y + 23.5 + breath, 3.2, 0.2, Math.PI - 0.2);
            else {
                ctx.moveTo(cx + 1, y + 22.5 + breath);
                ctx.lineTo(cx + 7, y + 23 + breath);
            }
            ctx.stroke();
        }

        // ============================================================
        // CYBORG — asymmetric combat chassis, human face + machine
        // ============================================================
        function drawCyborg(f, x, y, w, h, breath) {
            const punch = f.punching ? 16 : 0;
            const jump = f.isJumping ? 3 : 0;
            const hurt = f.expression === 'hurt';
            const cx = x + w / 2;
            const glow = 0.55 + Math.sin(frameCount * 0.08) * 0.25;

            // ----- MECHANICAL LEGS -----
            // left more humanoid plating, right piston
            const legG = ctx.createLinearGradient(x, y + 52, x, y + 74);
            legG.addColorStop(0, '#5a7a92');
            legG.addColorStop(1, '#1a2a3a');
            ctx.fillStyle = legG;
            rr(x + 8, y + 54 + jump, 8, 16 - jump, 2);
            rr(x + w - 16, y + 54 + jump, 8, 16 - jump, 2);
            // piston rods
            ctx.fillStyle = '#9ad8f0';
            ctx.globalAlpha = 0.7;
            ctx.fillRect(x + 11, y + 58 + jump, 2, 8);
            ctx.fillRect(x + w - 13, y + 58 + jump, 2, 8);
            ctx.globalAlpha = 1;
            // knee servos
            ctx.fillStyle = '#2a3a4a';
            ellipse(x + 12, y + 62 + jump, 4.5, 4.5);
            ellipse(x + w - 12, y + 62 + jump, 4.5, 4.5);
            ctx.fillStyle = `rgba(0,220,255,${glow})`;
            ellipse(x + 12, y + 62 + jump, 1.6, 1.6);
            ellipse(x + w - 12, y + 62 + jump, 1.6, 1.6);
            // boots
            ctx.fillStyle = '#0e1822';
            rr(x + 5, y + 68 + jump, 13, 6, 2);
            rr(x + w - 17, y + 68 + jump, 13, 6, 2);
            ctx.fillStyle = `rgba(0,200,255,${0.35 * glow})`;
            ctx.fillRect(x + 7, y + 70 + jump, 9, 1.2);
            ctx.fillRect(x + w - 15, y + 70 + jump, 9, 1.2);

            // ----- HIP PLATE -----
            ctx.fillStyle = '#243444';
            rr(x + 6, y + 48 + breath * 0.2, w - 12, 10, 3);
            ctx.strokeStyle = '#4a6a82';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 8, y + 50 + breath * 0.2, w - 16, 6);
            ctx.fillStyle = `rgba(0,220,255,${0.25 * glow})`;
            ctx.fillRect(x + 10, y + 52 + breath * 0.2, w - 20, 2);

            // ----- TORSO CHASSIS -----
            const chest = ctx.createLinearGradient(x + 7, y + 22, x + w - 7, y + 50);
            chest.addColorStop(0, '#6a8aa2');
            chest.addColorStop(0.4, '#3a5a72');
            chest.addColorStop(1, '#1a3044');
            ctx.fillStyle = chest;
            rr(x + 7, y + 22 + breath, w - 14, 28, 4);
            // plate seams
            ctx.strokeStyle = 'rgba(10,20,30,0.45)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(cx - 2, y + 24 + breath); ctx.lineTo(cx - 2, y + 48 + breath);
            ctx.moveTo(x + 10, y + 34 + breath); ctx.lineTo(x + w - 10, y + 34 + breath);
            ctx.stroke();
            // reactor core
            const core = ctx.createRadialGradient(cx + 1, y + 36 + breath, 1, cx + 1, y + 36 + breath, 9);
            core.addColorStop(0, `rgba(180,255,255,${0.9 * glow})`);
            core.addColorStop(0.4, `rgba(0,210,255,${0.55 * glow})`);
            core.addColorStop(1, 'rgba(0,80,140,0)');
            ctx.fillStyle = core;
            ellipse(cx + 1, y + 36 + breath, 9, 9);
            ctx.fillStyle = `rgba(0,230,255,${0.8 * glow})`;
            ellipse(cx + 1, y + 36 + breath, 3.2, 3.2);
            // vent slits
            ctx.fillStyle = '#0a1520';
            for (let i = 0; i < 3; i++) ctx.fillRect(x + 10, y + 26 + breath + i * 2.4, 6, 1.3);

            // ----- BACK ARM (more human + plating) -----
            ctx.fillStyle = '#c8d0d8';
            rr(x + 3, y + 24 + breath, 6, 14, 2);
            ctx.fillStyle = '#3a5a72';
            rr(x + 2, y + 30 + breath, 7, 8, 2);
            ctx.fillStyle = '#2a3a4a';
            ellipse(x + 6, y + 44 + breath, 6, 5.5);
            ctx.fillStyle = `rgba(0,200,255,${0.4 * glow})`;
            ellipse(x + 6, y + 44 + breath, 2, 2);

            // ----- FRONT ARM — heavy mech -----
            const armX = x + w - 11 + punch;
            ctx.fillStyle = '#4a6a82';
            rr(armX, y + 20 + breath, 10, 20, 2);
            ctx.fillStyle = '#1a2a38';
            rr(armX + 1, y + 24 + breath, 8, 5, 1);
            ctx.fillStyle = `rgba(0,220,255,${glow})`;
            ctx.fillRect(armX + 2, y + 25.5 + breath, 6, 1.6);
            // hydraulic
            ctx.strokeStyle = '#8ab0c8';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(armX + 5, y + 30 + breath);
            ctx.lineTo(armX + 5, y + 38 + breath);
            ctx.stroke();
            // fist chassis
            const gx = x + w - 1 + punch;
            const gy = y + 28 + breath + (f.punching ? -5 : 0);
            const gg = ctx.createRadialGradient(gx - 5, gy - 4, 2, gx, gy, 13);
            gg.addColorStop(0, '#7ec8e8');
            gg.addColorStop(0.45, '#3a88aa');
            gg.addColorStop(1, '#123044');
            ctx.fillStyle = gg;
            ellipse(gx, gy, 12.5, 11.5);
            ctx.fillStyle = '#0a1822';
            rr(gx - 8, gy + 5, 14, 5, 2);
            ctx.fillStyle = `rgba(0,230,255,${0.7 * glow})`;
            for (let i = 0; i < 3; i++) ellipse(gx - 5 + i * 5, gy - 1, 1.5, 2.8);

            // ----- PAULDRON -----
            ctx.fillStyle = '#2a3e50';
            ctx.beginPath();
            ctx.moveTo(x + w - 8, y + 20 + breath);
            ctx.lineTo(x + w + 4, y + 18 + breath);
            ctx.lineTo(x + w + 2, y + 30 + breath);
            ctx.lineTo(x + w - 10, y + 28 + breath);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = `rgba(0,210,255,${0.35 * glow})`;
            ctx.fillRect(x + w - 4, y + 21 + breath, 6, 2);

            // ----- NECK RING -----
            ctx.fillStyle = '#1a2a38';
            rr(cx - 6, y + 19 + breath, 12, 6, 2);
            ctx.fillStyle = `rgba(0,220,255,${0.45 * glow})`;
            ctx.fillRect(cx - 4, y + 21 + breath, 8, 1.2);

            // ----- HEAD (human jaw + cranial implant + visor) -----
            const hg = ctx.createRadialGradient(cx - 4, y + 8 + breath, 3, cx, y + 13 + breath, 16);
            hg.addColorStop(0, '#e0e6ec');
            hg.addColorStop(0.55, '#c8d0d8');
            hg.addColorStop(1, '#8a96a2');
            ctx.fillStyle = hg;
            ellipse(cx, y + 13 + breath, 15, 16.5);

            // cranial plate (top-left)
            ctx.fillStyle = '#2a3a4a';
            ctx.beginPath();
            ctx.ellipse(cx - 4, y + 5 + breath, 12, 9, -0.3, Math.PI, 0.2);
            ctx.fill();
            ctx.strokeStyle = '#4a6a82';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(cx - 12, y + 8 + breath);
            ctx.lineTo(cx + 2, y + 4 + breath);
            ctx.stroke();
            // rivets
            ctx.fillStyle = '#7a9ab0';
            ellipse(cx - 8, y + 5 + breath, 1.1, 1.1);
            ellipse(cx - 2, y + 3.5 + breath, 1.1, 1.1);

            // visor over front eye
            ctx.fillStyle = '#061018';
            rr(cx + 1, y + 10 + breath, 14, 7, 2);
            ctx.fillStyle = hurt ? `rgba(255,60,60,${0.75 * glow})` : `rgba(0,230,255,${0.75 * glow})`;
            rr(cx + 2, y + 11.5 + breath, 12, 4, 1);
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.35;
            ctx.fillRect(cx + 3, y + 12 + breath, 5, 1);
            ctx.globalAlpha = 1;

            // human eye (rear / inner)
            ctx.fillStyle = '#f8fbff';
            ellipse(cx - 5, y + 14 + breath, 3.2, 3);
            ctx.fillStyle = '#1a3048';
            ellipse(cx - 4.2, y + 14 + breath, 1.7, 1.7);
            ctx.fillStyle = '#fff';
            ellipse(cx - 3.6, y + 13.2 + breath, 0.7, 0.7);

            // brow implant line
            ctx.strokeStyle = '#3a4a5a';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(cx - 10, y + 10 + breath);
            ctx.lineTo(cx + 1, y + 9 + breath);
            ctx.stroke();

            // jaw plate
            ctx.fillStyle = '#3a4e5e';
            ctx.beginPath();
            ctx.moveTo(cx - 8, y + 20 + breath);
            ctx.lineTo(cx + 10, y + 19 + breath);
            ctx.lineTo(cx + 8, y + 25 + breath);
            ctx.lineTo(cx - 6, y + 25 + breath);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = `rgba(0,200,255,${0.3 * glow})`;
            ctx.fillRect(cx - 4, y + 21.5 + breath, 10, 1.2);

            // mouth slit
            ctx.fillStyle = '#0a1218';
            ctx.fillRect(cx - 1, y + 22.5 + breath, 8, 1.4);

            // ear module
            ctx.fillStyle = '#1a2a38';
            rr(cx + 13, y + 12 + breath, 4, 7, 1);
            ctx.fillStyle = `rgba(0,220,255,${glow})`;
            ellipse(cx + 15, y + 15 + breath, 1.2, 1.2);

            // cable from neck to shoulder
            ctx.strokeStyle = '#1a2834';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx + 8, y + 22 + breath);
            ctx.quadraticCurveTo(x + w - 2, y + 26 + breath, x + w - 6, y + 22 + breath);
            ctx.stroke();
            ctx.strokeStyle = `rgba(0,180,220,${0.4 * glow})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
        }


        // ============================================================
        // UTILIDADES DE COR
        // ============================================================

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 128, g: 128, b: 128 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(c => Math.min(255, Math.max(0, Math.round(c))).toString(16).padStart(2, '0')).join('');
        }

        function lightenColor(hex, percent) {
            const { r, g, b } = hexToRgb(hex);
            return rgbToHex(
                r + (255 - r) * (percent / 100),
                g + (255 - g) * (percent / 100),
                b + (255 - b) * (percent / 100)
            );
        }

        function darkenColor(hex, percent) {
            const { r, g, b } = hexToRgb(hex);
            return rgbToHex(
                r * (1 - percent / 100),
                g * (1 - percent / 100),
                b * (1 - percent / 100)
            );
        }

        // ---- POLYFILL roundRect ----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                const radii = r || { tl: 0, tr: 0, br: 0, bl: 0 };
                this.moveTo(x + radii.tl, y);
                this.lineTo(x + w - radii.tr, y);
                this.quadraticCurveTo(x + w, y, x + w, y + radii.tr);
                this.lineTo(x + w, y + h - radii.br);
                this.quadraticCurveTo(x + w, y + h, x + w - radii.br, y + h);
                this.lineTo(x + radii.bl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - radii.bl);
                this.lineTo(x, y + radii.tl);
                this.quadraticCurveTo(x, y, x + radii.tl, y);
                this.closePath();
                return this;
            };
        }

        // ============================================================
        // DRAW PRINCIPAL
        // ============================================================

        function draw() {
            ctx.save();

            if (shakeAmount > 0.5) {
                const sx = (Math.random() - 0.5) * shakeAmount * 1.5;
                const sy = (Math.random() - 0.5) * shakeAmount * 1.5;
                ctx.translate(sx, sy);
            }

            ctx.clearRect(-10, -10, W + 20, H + 20);

            // ---- DESENHA O CENÁRIO ----
            const stage = STAGES[selectedStage];
            if (stage) {
                stage.draw();
            }

            // ---- TRAIL ----
            if (p1 && p2) {
                [p1, p2].forEach(p => {
                    p.trail.forEach(t => {
                        ctx.globalAlpha = t.life / 15 * 0.15;
                        const trailColor = p.skin.accent || '#ffdd44';
                        ctx.fillStyle = trailColor;
                        ctx.shadowBlur = 25;
                        ctx.shadowColor = trailColor;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, 5 * (t.life / 15), 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                });
            }

            // ---- PARTÍCULAS ----
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 30;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // ---- TEXTOS ----
            textEffects.forEach(t => {
                ctx.globalAlpha = t.alpha;
                ctx.font = `bold ${t.size}px "Black Ops One", "Orbitron", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.fillStyle = t.color;
                ctx.shadowColor = t.color + '40';
                ctx.shadowBlur = 60;
                ctx.fillText(t.text, t.x, t.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            // ---- PERSONAGENS ----
            if (p1 && p2) {
                if (p1.x < p2.x) {
                    drawFighter(p1);
                    drawFighter(p2);
                } else {
                    drawFighter(p2);
                    drawFighter(p1);
                }
            }

            // ---- GAME OVER ----
            if (gameOver && p1 && p2) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);

                const grad2 = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 350);
                grad2.addColorStop(0, 'rgba(247,212,74,0.08)');
                grad2.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad2;
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#000000cc';
                ctx.shadowBlur = 50;

                const name = winner === 'p1' ? p1.charName : p2.charName;
                const emoji = winner === 'p1' ? CHARACTERS[selectedP1].emoji : CHARACTERS[selectedP2].emoji;

                ctx.font = 'bold 56px "Black Ops One", "Orbitron", sans-serif';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 60;
                ctx.fillStyle = '#f7e05e';
                ctx.fillText(`🏆 ${emoji} ${name}`, W / 2, H / 2 - 15);

                ctx.font = '18px "Rajdhani", "Segoe UI", sans-serif';
                ctx.shadowBlur = 30;
                ctx.fillStyle = 'rgba(179, 213, 245, 0.7)';
                ctx.fillText('PRESS RESET FOR A NEW BATTLE', W / 2, H / 2 + 55);

                ctx.shadowBlur = 0;
            }

            // ---- NOMES ----
            if (p1 && p2 && !gameOver) {
                const GY = STAGES[selectedStage].groundY || 355;
                ctx.font = '600 14px "Rajdhani", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 12;
                ctx.fillText(p1.charName, p1.x + p1.w / 2, GY + 34);
                ctx.fillText(p2.charName, p2.x + p2.w / 2, GY + 34);
                ctx.shadowBlur = 0;
            }

            // ---- INDICADOR SPECIAL ----
            if (p1 && p2 && !gameOver) {
                [p1, p2].forEach((p, i) => {
                    if (p.special >= SPECIAL_COST) {
                        const x = i === 0 ? 20 : W - 60;
                        const y = 20;
                        const pulse = Math.sin(frameCount * 0.05) * 0.3 + 0.7;
                        ctx.fillStyle = `rgba(247,212,74,${0.15 * pulse})`;
                        ctx.shadowColor = '#f7d44a';
                        ctx.shadowBlur = 30 * pulse;
                        ctx.beginPath();
                        ctx.arc(x, y, 14, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#f7d44a';
                        ctx.shadowBlur = 40 * pulse;
                        ctx.font = '18px "Segoe UI"';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⚡', x, y + 1);
                        ctx.shadowBlur = 0;
                    }
                });
            }

            ctx.restore();
        }

        // --- GAME LOOP ---
        function gameLoop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- CHARACTER SELECTION ---
        charCards.forEach(card => {
            card.addEventListener('click', () => {
                const key = card.dataset.char;

                if (selectionPhase === 'p1') {
                    charCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedP1 = key;
                    p1Preview.textContent = `P1: ${CHARACTERS[key].emoji} ${CHARACTERS[key].name}`;
                    selectionPhase = 'p2';
                    selectInstruction.textContent = '✦ PLAYER 2, CHOOSE YOUR CHAMPION ✦';
                    startBtn.disabled = true;
                } else if (selectionPhase === 'p2') {
                    charCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedP2 = key;
                    p2Preview.textContent = `P2: ${CHARACTERS[key].emoji} ${CHARACTERS[key].name}`;
                    startBtn.disabled = false;
                    selectInstruction.textContent = '✦ READY FOR BATTLE! ✦';
                }
            });
        });

        // --- START ---
        startBtn.addEventListener('click', () => {
            if (selectedP1 && selectedP2) {
                initGame();
                if (audio.enabled && audio.ctx.state === 'suspended') {
                    audio.ctx.resume();
                }
            }
        });

        // --- MENU ---
        menuBtn.addEventListener('click', goToMenu);

        // --- RESET ---
        resetBtn.addEventListener('click', () => {
            if (gameStarted) {
                resetFight();
            } else {
                goToMenu();
            }
        });

        // --- KEYBOARD ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            const controlKeys = ['a', 'd', 'w', 'j', 'k', 'arrowleft', 'arrowright', 'arrowup', 'l', 'ç', ';'];
            if (controlKeys.includes(k) || k === 'arrowleft' || k === 'arrowright' || k === 'arrowup') {
                e.preventDefault();
            }
            if (k === 'a') keys.a = true;
            if (k === 'd') keys.d = true;
            if (k === 'w') keys.w = true;
            if (k === 'j') keys.j = true;
            if (k === 'k') keys.k = true;
            if (!vsBot) {
                if (k === 'arrowleft') keys.left = true;
                if (k === 'arrowright') keys.right = true;
                if (k === 'arrowup') keys.up = true;
                if (k === 'l') keys.l = true;
                if (k === 'ç' || k === ';') keys.ç = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'a') keys.a = false;
            if (k === 'd') keys.d = false;
            if (k === 'w') keys.w = false;
            if (k === 'j') keys.j = false;
            if (k === 'k') keys.k = false;
            if (!vsBot) {
                if (k === 'arrowleft') keys.left = false;
                if (k === 'arrowright') keys.right = false;
                if (k === 'arrowup') keys.up = false;
                if (k === 'l') keys.l = false;
                if (k === 'ç' || k === ';') keys.ç = false;
            }
        });

        // --- START ---
        requestAnimationFrame(gameLoop);

    })();
</script>
