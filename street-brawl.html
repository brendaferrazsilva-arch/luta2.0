<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ STREET BRAWL - ULTIMATE EDITION ⚔️</title>
    <style>
        /* ============================================================
           CSS ULTRA-PROFISSIONAL - DESIGN PREMIUM
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Black+Ops+One&display=swap');

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 200px 50px, #eee, transparent);
            background-size: 200px 200px;
            animation: starsMove 60s linear infinite;
        }

        @keyframes starsMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        .game-wrapper {
            background: linear-gradient(145deg, #14181f, #0a0e14);
            padding: 25px 30px 30px;
            border-radius: 60px;
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 0 100px rgba(247, 212, 74, 0.03);
            position: relative;
            max-width: 960px;
            width: 100%;
            border: 1px solid rgba(247, 212, 74, 0.08);
            z-index: 1;
        }

        .game-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: linear-gradient(135deg, rgba(247, 212, 74, 0.15), transparent 40%, transparent 60%, rgba(247, 212, 74, 0.15));
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            aspect-ratio: 900/450;
            border-radius: 32px;
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.7),
                0 20px 40px rgba(0, 0, 0, 0.6);
            background: #1a2a3a;
            cursor: none;
            transition: filter 0.3s;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 8px 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .health-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 18px 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .health-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .health-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: #8ab4d6;
            text-shadow: 0 0 20px rgba(138, 180, 214, 0.2);
            letter-spacing: 2px;
            min-width: 28px;
        }

        .health-bg {
            width: 140px;
            height: 20px;
            background: rgba(30, 15, 15, 0.8);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .health-bg::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 30px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            border-radius: 30px;
            transition: width 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.2);
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 8px;
            right: 8px;
            height: 5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 10px;
        }

        .health-fill.p1 {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.3);
        }

        .health-fill.p2 {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.3);
        }

        .health-fill.danger {
            animation: dangerPulse 0.5s ease-in-out infinite;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .special-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 14, 20, 0.8);
            padding: 4px 14px 4px 10px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .special-bg {
            width: 70px;
            height: 8px;
            background: rgba(20, 10, 40, 0.8);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .special-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #f7d44a, #ff6b00);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.3);
        }

        .special-fill.full {
            animation: specialGlow 0.6s ease-in-out infinite;
        }

        @keyframes specialGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(247, 212, 74, 0.3); }
            50% { box-shadow: 0 0 60px rgba(247, 212, 74, 0.6), 0 0 100px rgba(255, 107, 0, 0.3); }
        }

        .special-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: #f7d44a;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .controls-hud {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 18px 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.65rem;
            color: rgba(176, 208, 224, 0.7);
            flex-wrap: wrap;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .key {
            background: rgba(30, 51, 69, 0.6);
            padding: 2px 10px;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            color: #b0d0e0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .key.special-key {
            background: linear-gradient(135deg, rgba(247, 212, 74, 0.2), rgba(255, 107, 0, 0.2));
            color: #f7d44a;
            border-color: rgba(247, 212, 74, 0.2);
        }

        .vs-badge {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 900;
            color: #f7d44a;
            text-shadow: 0 0 30px rgba(247, 212, 74, 0.2);
            animation: vsPulse 2s ease-in-out infinite;
            padding: 0 4px;
        }

        @keyframes vsPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .winner-display {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 22px;
            border-radius: 50px;
            color: #fadf8a;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(247, 212, 74, 0.1);
            min-width: 160px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.5s;
        }

        .winner-display.victory {
            border-color: #f7d44a;
            box-shadow: 0 0 40px rgba(247, 212, 74, 0.1), inset 0 2px 20px rgba(0, 0, 0, 0.5);
            animation: victoryPulse 1s ease-in-out infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { border-color: #f7d44a; }
            50% { border-color: #ff6b00; }
        }

        .btn-reset, .btn-menu {
            background: linear-gradient(135deg, rgba(42, 74, 90, 0.6), rgba(26, 42, 58, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-reset:hover, .btn-menu:hover {
            background: linear-gradient(135deg, rgba(42, 74, 90, 0.9), rgba(26, 42, 58, 0.9));
            color: #fff;
            border-color: rgba(247, 212, 74, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-reset:active, .btn-menu:active {
            transform: translateY(1px);
        }

        .btn-menu {
            background: linear-gradient(135deg, rgba(74, 42, 90, 0.6), rgba(42, 26, 58, 0.6));
            border-color: rgba(180, 100, 200, 0.1);
        }

        .btn-menu:hover {
            background: linear-gradient(135deg, rgba(74, 42, 90, 0.9), rgba(42, 26, 58, 0.9));
            border-color: rgba(180, 100, 200, 0.3);
        }

        .hud-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== TELA DE SELEÇÃO ===== */
        .char-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 60px;
            z-index: 20;
            padding: 20px 25px;
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .char-select.hidden {
            display: none;
        }

        .char-select h2 {
            font-family: 'Black Ops One', 'Orbitron', monospace;
            color: #f7d44a;
            font-size: 1.6rem;
            text-shadow: 0 0 60px rgba(247, 212, 74, 0.2);
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .char-select .subtitle {
            color: rgba(139, 180, 204, 0.7);
            font-size: 0.75rem;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 3px;
            animation: blinkText 1.5s ease-in-out infinite;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        .char-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 700px;
        }

        .char-card {
            background: linear-gradient(145deg, rgba(26, 42, 56, 0.6), rgba(13, 26, 36, 0.6));
            padding: 12px 14px;
            border-radius: 22px;
            text-align: center;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            min-width: 80px;
            flex: 1;
            max-width: 110px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .char-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(247, 212, 74, 0.05), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .char-card:hover::before {
            opacity: 1;
        }

        .char-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(247, 212, 74, 0.2);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        }

        .char-card.selected {
            border-color: #f7d44a;
            background: linear-gradient(145deg, rgba(247, 212, 74, 0.08), rgba(13, 26, 36, 0.6));
            box-shadow: 0 0 60px rgba(247, 212, 74, 0.05), 0 16px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(-6px) scale(1.02);
        }

        .char-card.selected::after {
            content: '✦';
            position: absolute;
            top: 4px;
            right: 8px;
            color: #f7d44a;
            font-size: 0.8rem;
            animation: starSpin 3s linear infinite;
        }

        @keyframes starSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .char-card .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 2px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s;
        }

        .char-card:hover .emoji {
            transform: scale(1.1) rotate(-5deg);
        }

        .char-card .name {
            color: #ecf9ff;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .char-card .stats {
            color: rgba(139, 180, 204, 0.6);
            font-size: 0.4rem;
            margin-top: 2px;
            line-height: 1.4;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .char-card .stats span {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 4px;
            border-radius: 8px;
            margin: 1px;
            font-size: 0.35rem;
        }

        /* ===== SELEÇÃO DE CENÁRIO ===== */
        .stage-select {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stage-select label {
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stage-btn {
            background: rgba(13, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(179, 214, 240, 0.6);
            padding: 3px 12px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        .stage-btn:hover {
            border-color: rgba(247, 212, 74, 0.2);
            color: #ecf9ff;
            background: rgba(26, 42, 56, 0.6);
            transform: translateY(-2px);
        }

        .stage-btn.active {
            border-color: #f7d44a;
            color: #f7d44a;
            background: rgba(247, 212, 74, 0.1);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.05);
        }

        .stage-btn .stage-emoji {
            margin-right: 2px;
        }

        .select-preview {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 1px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .select-preview span {
            background: rgba(13, 26, 36, 0.6);
            padding: 3px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            min-width: 90px;
            text-align: center;
        }

        .select-preview .vs-divider {
            color: #f7d44a;
            font-size: 1.2rem;
            font-weight: 900;
            text-shadow: 0 0 40px rgba(247, 212, 74, 0.2);
        }

        .btn-start {
            margin-top: 12px;
            background: linear-gradient(135deg, #f7d44a, #e6b800);
            border: none;
            color: #0a0a0f;
            font-family: 'Black Ops One', 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 8px 40px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 #a88300, 0 12px 40px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 0 #a88300, 0 20px 60px rgba(247, 212, 74, 0.15);
        }

        .btn-start:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #a88300;
        }

        .btn-start:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .bot-level-label {
            color: rgba(247, 212, 74, 0.8);
            font-size: 0.65rem;
            letter-spacing: 1px;
            min-width: 70px;
        }

        /* ===== COMBO DISPLAY ===== */
        .combo-display {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Black Ops One', 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            color: #f7d44a;
            text-shadow:
                0 0 60px rgba(247, 212, 74, 0.3),
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 120px rgba(247, 212, 74, 0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
            letter-spacing: 4px;
        }

        .combo-display.show {
            opacity: 1;
            animation: comboPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        .combo-display.mega {
            color: #ff4400;
            text-shadow:
                0 0 80px rgba(255, 68, 0, 0.4),
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 150px rgba(255, 68, 0, 0.2);
            animation: megaCombo 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes megaCombo {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(-20deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.4) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 60px;
            background: white;
            opacity: 0;
            z-index: 5;
            transition: opacity 0.05s;
        }

        @media (max-width: 768px) {
            .game-wrapper { padding: 14px; border-radius: 40px; }
            .health-bg { width: 80px; height: 16px; }
            .char-card { min-width: 60px; padding: 8px 10px; }
            .char-card .emoji { font-size: 2rem; }
            .char-select h2 { font-size: 1rem; letter-spacing: 3px; }
            .controls-hud { font-size: 0.5rem; padding: 4px 12px; gap: 4px; }
            .winner-display { min-width: 100px; font-size: 0.5rem; padding: 4px 12px; }
            .key { font-size: 0.45rem; padding: 2px 6px; }
            .btn-reset, .btn-menu { font-size: 0.45rem; padding: 5px 14px; }
            .btn-start { font-size: 0.6rem; padding: 8px 28px; }
            .select-preview span { min-width: 70px; font-size: 0.6rem; padding: 3px 10px; }
            .special-bg { width: 45px; height: 6px; }
            .combo-display { font-size: 2.5rem; top: 28%; }
            .health-label { font-size: 0.5rem; min-width: 20px; }
            .vs-badge { font-size: 0.8rem; }
            .char-select { padding: 12px 15px; border-radius: 40px; }
            .char-grid { gap: 6px; }
            .flash-overlay { border-radius: 40px; }
            .stage-select { gap: 4px; }
            .stage-btn { font-size: 0.5rem; padding: 2px 8px; }
            .stage-select label { font-size: 0.55rem; }
        }

        @media (max-width: 480px) {
            .game-wrapper { padding: 8px; border-radius: 30px; }
            .hud { gap: 4px; margin-top: 8px; }
            .health-container { padding: 4px 8px; gap: 4px; }
            .health-bg { width: 50px; height: 12px; }
            .char-card { min-width: 45px; padding: 5px 5px; }
            .char-card .emoji { font-size: 1.4rem; }
            .char-grid { gap: 4px; }
            .controls-hud { font-size: 0.4rem; padding: 3px 6px; gap: 3px; }
            .winner-display { min-width: 60px; font-size: 0.4rem; padding: 3px 8px; }
            .key { font-size: 0.35rem; padding: 1px 4px; }
            .combo-display { font-size: 1.8rem; top: 25%; }
            .btn-start { font-size: 0.5rem; padding: 6px 18px; }
            .select-preview span { min-width: 50px; font-size: 0.45rem; padding: 2px 6px; }
            .char-select h2 { font-size: 0.7rem; letter-spacing: 2px; }
            .flash-overlay { border-radius: 30px; }
            .stage-btn { font-size: 0.45rem; padding: 2px 6px; }
            .stage-select label { font-size: 0.45rem; }
        }
    </style>
</head>
<body>

<div class="stars"></div>

<div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas" width="900" height="450"></canvas>

    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="combo-display" id="comboDisplay"></div>

    <!-- Tela de Seleção -->
    <div class="char-select" id="charSelect">
        <h2>⚔️ SELECT YOUR FIGHTER</h2>
        <div class="subtitle" id="selectInstruction">✦ PLAYER 1, CHOOSE YOUR CHAMPION ✦</div>
        <div class="char-grid" id="charGrid">
            <div class="char-card" data-char="boxer">
                <span class="emoji">🥊</span>
                <div class="name">Boxeador</div>
                <div class="stats">⚡ 4.5 • 💥 14 • ❤️ 100</div>
            </div>
            <div class="char-card" data-char="ninja">
                <span class="emoji">🥷</span>
                <div class="name">Ninja</div>
                <div class="stats">⚡ 5.5 • 💥 11 • ❤️ 85</div>
            </div>
            <div class="char-card" data-char="samurai">
                <span class="emoji">⚔️</span>
                <div class="name">Samurai</div>
                <div class="stats">⚡ 3.8 • 💥 19 • ❤️ 120</div>
            </div>
            <div class="char-card" data-char="wrestler">
                <span class="emoji">🥋</span>
                <div class="name">Lutador</div>
                <div class="stats">⚡ 3.5 • 💥 17 • ❤️ 135</div>
            </div>
            <div class="char-card" data-char="cyborg">
                <span class="emoji">🤖</span>
                <div class="name">Ciborgue</div>
                <div class="stats">⚡ 4.0 • 💥 15 • ❤️ 110</div>
            </div>
        </div>

        <!-- SELEÇÃO DE CENÁRIO -->
        <div class="stage-select">
            <label>🎯 STAGE:</label>
            <button class="stage-btn active" data-stage="dojo">🏯 Dojo</button>
            <button class="stage-btn" data-stage="beach">🏖️ Beach</button>
            <button class="stage-btn" data-stage="volcano">🌋 Volcano</button>
            <button class="stage-btn" data-stage="neon">🌃 Neon</button>
            <button class="stage-btn" data-stage="arena">🏛️ Arena</button>
            <button class="stage-btn" data-stage="forest">🌲 Forest</button>
            <button class="stage-btn" data-stage="castle">🏰 Castle</button>
        </div>

        <div class="stage-select" id="botModeRow">
            <label>MODE:</label>
            <button class="stage-btn" id="botModeBtn" type="button">🤖 VS BOT</button>
            <span id="botLevelLabel" class="bot-level-label">Nv. 1 / 5</span>
        </div>

        <div class="select-preview">
            <span id="p1Preview">P1: ⚪ None</span>
            <span class="vs-divider">⚔</span>
            <span id="p2Preview">P2: ⚪ None</span>
        </div>
        <button class="btn-start" id="startBtn" disabled>⚔️ START BATTLE</button>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-left">
            <div class="health-container">
                <span class="health-label" id="p1Label">P1</span>
                <div class="health-bg">
                    <div id="healthP1" class="health-fill p1" style="width: 100%"></div>
                </div>
            </div>
            <div class="special-bar">
                <span class="special-label">⚡</span>
                <div class="special-bg">
                    <div id="specialP1" class="special-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="hud-right">
            <div class="special-bar">
                <div class="special-bg">
                    <div id="specialP2" class="special-fill" style="width: 0%"></div>
                </div>
                <span class="special-label">⚡</span>
            </div>
            <div class="health-container">
                <div class="health-bg">
                    <div id="healthP2" class="health-fill p2" style="width: 100%"></div>
                </div>
                <span class="health-label" id="p2Label">P2</span>
            </div>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px;">
        <div class="controls-hud">
            <span><span class="key">A</span><span class="key">D</span></span>
            <span><span class="key">W</span></span>
            <span><span class="key">J</span></span>
            <span><span class="key special-key">K</span></span>
            <span class="vs-badge">⚔</span>
            <span><span class="key">←</span><span class="key">→</span></span>
            <span><span class="key">↑</span></span>
            <span><span class="key">L</span></span>
            <span><span class="key special-key">Ç</span></span>
        </div>
        <div class="hud-buttons">
            <div class="winner-display" id="winnerDisplay">⚔️ FIGHT!</div>
            <button class="btn-menu" id="menuBtn">🏠 MENU</button>
            <button class="btn-reset" id="resetBtn">↻ RESET</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ===== JAVASCRIPT - CENÁRIOS PROFISSIONAIS =====
    // ============================================================

    (function() {
        'use strict';

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 900, H = 450;

        const healthP1 = document.getElementById('healthP1');
        const healthP2 = document.getElementById('healthP2');
        const specialP1 = document.getElementById('specialP1');
        const specialP2 = document.getElementById('specialP2');
        const winnerDisplay = document.getElementById('winnerDisplay');
        const p1Label = document.getElementById('p1Label');
        const p2Label = document.getElementById('p2Label');
        const comboDisplay = document.getElementById('comboDisplay');
        const flashOverlay = document.getElementById('flashOverlay');

        const charSelect = document.getElementById('charSelect');
        const charCards = document.querySelectorAll('.char-card');
        const startBtn = document.getElementById('startBtn');
        const p1Preview = document.getElementById('p1Preview');
        const p2Preview = document.getElementById('p2Preview');
        const selectInstruction = document.getElementById('selectInstruction');
        const menuBtn = document.getElementById('menuBtn');
        const resetBtn = document.getElementById('resetBtn');

        // --- STAGE SELECTION ---
        let selectedStage = 'dojo';
        const stageBtns = document.querySelectorAll('.stage-btn');

        stageBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                stageBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedStage = btn.dataset.stage;
            });
        });

        // ============================================================
        // CENÁRIOS PROFISSIONAIS - COMPLETOS
        // ============================================================

        const STAGES = {
            dojo: {
                name: 'Dojo',
                groundY: 355,
                draw: function() {
                    const GY = this.groundY;
                    
                    // ---- FUNDO - PAREDES ----
                    // Parede de fundo
                    const wallGrad = ctx.createLinearGradient(0, 0, 0, GY);
                    wallGrad.addColorStop(0, '#2a1a0a');
                    wallGrad.addColorStop(0.3, '#3a2a1a');
                    wallGrad.addColorStop(0.7, '#4a3a2a');
                    wallGrad.addColorStop(1, '#2a1a0a');
                    ctx.fillStyle = wallGrad;
                    ctx.fillRect(0, 0, W, GY);

                    // Painéis de madeira na parede
                    for (let i = 0; i < 12; i++) {
                        const x = i * 75;
                        ctx.fillStyle = i % 2 === 0 ? 'rgba(60,40,20,0.3)' : 'rgba(80,50,30,0.2)';
                        ctx.fillRect(x, 30, 75, GY - 80);
                        ctx.fillStyle = 'rgba(40,25,10,0.2)';
                        ctx.fillRect(x + 2, 35, 71, GY - 90);
                    }

                    // Linhas horizontais da parede
                    ctx.strokeStyle = 'rgba(50,30,15,0.3)';
                    ctx.lineWidth = 1;
                    for (let y = 60; y < GY - 40; y += 40) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(W, y);
                        ctx.stroke();
                    }

                    // ---- PILARES ----
                    const drawPillar = (x, y, h) => {
                        const grad = ctx.createLinearGradient(x - 8, y, x + 8, y);
                        grad.addColorStop(0, '#3a2a1a');
                        grad.addColorStop(0.3, '#6a4a3a');
                        grad.addColorStop(0.7, '#5a3a2a');
                        grad.addColorStop(1, '#2a1a0a');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - 8, y, 16, h);
                        // Base
                        ctx.fillStyle = '#4a3a2a';
                        ctx.fillRect(x - 12, y + h - 8, 24, 8);
                        ctx.fillRect(x - 10, y + h - 12, 20, 4);
                        // Topo
                        ctx.fillRect(x - 12, y - 4, 24, 8);
                        ctx.fillRect(x - 10, y - 8, 20, 4);
                    };

                    drawPillar(60, 30, GY - 50);
                    drawPillar(840, 30, GY - 50);
                    drawPillar(300, 30, GY - 50);
                    drawPillar(600, 30, GY - 50);

                    // ---- TATAME (CHÃO) ----
                    const tatameGrad = ctx.createLinearGradient(0, GY, 0, H);
                    tatameGrad.addColorStop(0, '#c4a87a');
                    tatameGrad.addColorStop(0.3, '#b8986a');
                    tatameGrad.addColorStop(0.7, '#a8885a');
                    tatameGrad.addColorStop(1, '#8a784a');
                    ctx.fillStyle = tatameGrad;
                    ctx.fillRect(0, GY + 4, W, H - GY);

                    // Bordas do tatame
                    ctx.fillStyle = 'rgba(60,40,20,0.3)';
                    ctx.fillRect(20, GY + 4, W - 40, 6);
                    ctx.fillRect(20, H - 10, W - 40, 6);
                    ctx.fillRect(20, GY + 4, 6, H - GY - 14);
                    ctx.fillRect(W - 26, GY + 4, 6, H - GY - 14);

                    // Linhas do tatame
                    for (let i = 0; i < 12; i++) {
                        const x = 40 + i * 75;
                        ctx.strokeStyle = 'rgba(80,60,30,0.15)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x, GY + 12);
                        ctx.lineTo(x, H - 12);
                        ctx.stroke();
                    }

                    // ---- DECORAÇÃO - KANJI ----
                    ctx.fillStyle = 'rgba(200,180,150,0.08)';
                    ctx.font = 'bold 80px "serif"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('武', W/2, GY/2 + 20);

                    // ---- LUZ DO TETO ----
                    const lightGrad = ctx.createRadialGradient(W/2, 10, 10, W/2, 10, 200);
                    lightGrad.addColorStop(0, 'rgba(255,220,150,0.15)');
                    lightGrad.addColorStop(0.5, 'rgba(255,220,150,0.05)');
                    lightGrad.addColorStop(1, 'rgba(255,220,150,0)');
                    ctx.fillStyle = lightGrad;
                    ctx.fillRect(0, 0, W, 200);

                    // Sombra dos pilares no chão
                    ctx.fillStyle = 'rgba(0,0,0,0.05)';
                    ctx.fillRect(52, GY + 8, 24, 12);
                    ctx.fillRect(292, GY + 8, 24, 12);
                    ctx.fillRect(592, GY + 8, 24, 12);
                    ctx.fillRect(832, GY + 8, 24, 12);
                }
            },

            beach: {
                name: 'Beach',
                groundY: 355,
                draw: function() {
                    const GY = this.groundY;
                    
                    // ---- CÉU ----
                    const skyGrad = ctx.createLinearGradient(0, 0, 0, GY);
                    skyGrad.addColorStop(0, '#1a7abf');
                    skyGrad.addColorStop(0.3, '#4a9acf');
                    skyGrad.addColorStop(0.6, '#87CEEB');
                    skyGrad.addColorStop(0.85, '#b8d8e8');
                    skyGrad.addColorStop(1, '#e8d8b8');
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, W, GY);

                    // ---- SOL ----
                    const sunGrad = ctx.createRadialGradient(750, 55, 5, 750, 55, 80);
                    sunGrad.addColorStop(0, 'rgba(255,255,200,1)');
                    sunGrad.addColorStop(0.2, 'rgba(255,220,100,0.9)');
                    sunGrad.addColorStop(0.5, 'rgba(255,200,50,0.4)');
                    sunGrad.addColorStop(1, 'rgba(255,200,50,0)');
                    ctx.fillStyle = sunGrad;
                    ctx.beginPath();
                    ctx.arc(750, 55, 80, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#fffbe0';
                    ctx.shadowBlur = 60;
                    ctx.shadowColor = 'rgba(255,200,50,0.4)';
                    ctx.beginPath();
                    ctx.arc(750, 55, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // ---- NUVENS ----
                    const drawCloud = (x, y, s) => {
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.beginPath();
                        ctx.arc(x, y, s * 0.5, 0, Math.PI * 2);
                        ctx.arc(x + s * 0.6, y - s * 0.1, s * 0.6, 0, Math.PI * 2);
                        ctx.arc(x + s * 1.1, y + s * 0.05, s * 0.4, 0, Math.PI * 2);
                        ctx.arc(x + s * 0.3, y + s * 0.15, s * 0.4, 0, Math.PI * 2);
                        ctx.fill();
                    };
                    drawCloud(150, 50, 60);
                    drawCloud(400, 35, 70);
                    drawCloud(600, 60, 50);

                    // ---- OCEANO ----
                    const oceanGrad = ctx.createLinearGradient(0, GY - 60, 0, GY);
                    oceanGrad.addColorStop(0, '#2a7abf');
                    oceanGrad.addColorStop(0.3, '#3a8acf');
                    oceanGrad.addColorStop(0.7, '#4a9adf');
                    oceanGrad.addColorStop(1, '#5aaae0');
                    ctx.fillStyle = oceanGrad;
                    ctx.fillRect(0, GY - 60, W, 64);

                    // Ondas
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1.5;
                    for (let i = 0; i < 8; i++) {
                        const y = GY - 50 + i * 7;
                        ctx.beginPath();
                        for (let x = 0; x < W; x += 2) {
                            const waveY = y + Math.sin(x * 0.02 + i * 0.8 + Date.now() * 0.0005) * 3;
                            if (x === 0) ctx.moveTo(x, waveY);
                            else ctx.lineTo(x, waveY);
                        }
                        ctx.stroke();
                    }

                    // ---- AREIA ----
                    const sandGrad = ctx.createLinearGradient(0, GY, 0, H);
                    sandGrad.addColorStop(0, '#f4d03f');
                    sandGrad.addColorStop(0.3, '#e8c84a');
                    sandGrad.addColorStop(0.6, '#d4b83a');
                    sandGrad.addColorStop(1, '#c4a82a');
                    ctx.fillStyle = sandGrad;
                    ctx.fillRect(0, GY + 4, W, H - GY);

                    // Textura da areia
                    for (let i = 0; i < 60; i++) {
                        const x = Math.random() * W;
                        const y = GY + 8 + Math.random() * (H - GY - 16);
                        ctx.fillStyle = `rgba(200,180,80,${0.1 + Math.random() * 0.15})`;
                        ctx.fillRect(x, y, 2 + Math.random() * 4, 1 + Math.random() * 2);
                    }

                    // ---- COQUEIROS ----
                    const drawPalm = (x, baseY, size) => {
                        const sway = Math.sin(Date.now() * 0.001 + x) * 2;
                        // Tronco
                        ctx.fillStyle = '#6a4a3a';
                        ctx.beginPath();
                        ctx.moveTo(x - 4, baseY);
                        ctx.quadraticCurveTo(x - 2 + sway * 0.3, baseY - size * 0.7, x + sway * 0.5, baseY - size);
                        ctx.quadraticCurveTo(x + 4 + sway * 0.3, baseY - size * 0.7, x + 4, baseY);
                        ctx.fill();
                        // Folhas
                        for (let i = 0; i < 7; i++) {
                            const angle = (i / 7) * Math.PI * 2 + Math.sin(Date.now() * 0.001 + i) * 0.1;
                            const len = size * 0.35;
                            ctx.fillStyle = ['#2d7a2d','#3a8a3a','#1a6a1a','#4a9a3a','#2a7a2a','#3a8a3a','#1a6a1a'][i];
                            ctx.beginPath();
                            ctx.moveTo(x + sway * 0.5, baseY - size * 0.85);
                            const ex = x + Math.cos(angle) * len + sway * 0.5;
                            const ey = baseY - size * 0.85 + Math.sin(angle) * len * 0.3;
                            ctx.quadraticCurveTo(x + Math.cos(angle - 0.3) * len * 0.5 + sway * 0.5, 
                                baseY - size * 0.85 + Math.sin(angle - 0.3) * len * 0.15, ex, ey);
                            ctx.quadraticCurveTo(x + Math.cos(angle + 0.3) * len * 0.5 + sway * 0.5, 
                                baseY - size * 0.85 + Math.sin(angle + 0.3) * len * 0.15, 
                                x + sway * 0.5, baseY - size * 0.85);
                            ctx.fill();
                        }
                        // Coco
                        ctx.fillStyle = '#5a3a1a';
                        ctx.beginPath();
                        ctx.arc(x + sway * 0.5, baseY - size * 0.82, 6, 0, Math.PI * 2);
                        ctx.fill();
                    };

                    drawPalm(55, GY + 4, 70);
                    drawPalm(845, GY + 4, 65);

                    // ---- PEDRAS ----
                    const drawRock = (x, y, s) => {
                        ctx.fillStyle = '#7a7a6a';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(0,0,0,0.1)';
                        ctx.beginPath();
                        ctx.moveTo(x - s, y);
                        ctx.quadraticCurveTo(x - s * 0.7, y - s * 0.5, x, y - s * 0.4);
                        ctx.quadraticCurveTo(x + s * 0.7, y - s * 0.5, x + s, y);
                        ctx.quadraticCurveTo(x + s * 0.5, y + s * 0.2, x, y + s * 0.3);
                        ctx.quadraticCurveTo(x - s * 0.5, y + s * 0.2, x - s, y);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    };
                    drawRock(200, GY + 10, 18);
                    drawRock(700, GY + 12, 15);
                    drawRock(350, GY + 8, 12);
                    drawRock(550, GY + 10, 20);

                    // ---- GUARDA-SOL ----
                    const drawUmbrella = (x, y) => {
                        ctx.fillStyle = '#6a6a6a';
                        ctx.fillRect(x - 1, y - 5, 3, 35);
                        ctx.fillStyle = '#e74c3c';
                        ctx.beginPath();
                        ctx.moveTo(x - 25, y - 5);
                        ctx.quadraticCurveTo(x, y - 35, x + 25, y - 5);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        for (let i = 0; i < 4; i++) {
                            const px = x - 20 + i * 13;
                            ctx.fillRect(px, y - 4, 1, 25);
                        }
                    };
                    drawUmbrella(160, GY + 10);
                    drawUmbrella(740, GY + 10);
                }
            },

            volcano: {
                name: 'Volcano',
                groundY: 355,
                draw: function() {
                    const GY = this.groundY;
                    
                    // ---- CÉU ESCURO ----
                    const skyGrad = ctx.createLinearGradient(0, 0, 0, GY);
                    skyGrad.addColorStop(0, '#0a0000');
                    skyGrad.addColorStop(0.3, '#1a0500');
                    skyGrad.addColorStop(0.6, '#2a0a00');
                    skyGrad.addColorStop(0.8, '#3a0a00');
                    skyGrad.addColorStop(1, '#4a1a0a');
                    ctx.fillStyle = skyGrad;
                    ctx.fillRect(0, 0, W, GY);

                    // ---- VULCÃO AO FUNDO ----
                    const drawVolcanoBg = (cx, cy, s) => {
                        ctx.fillStyle = '#1a0a0a';
                        ctx.beginPath();
                        ctx.moveTo(cx - s * 1.5, cy + 60);
                        ctx.quadraticCurveTo(cx - s, cy - s * 0.3, cx - s * 0.3, cy - s * 0.7);
                        ctx.quadraticCurveTo(cx, cy - s * 0.9, cx + s * 0.3, cy - s * 0.7);
                        ctx.quadraticCurveTo(cx + s, cy - s * 0.3, cx + s * 1.5, cy + 60);
                        ctx.fill();
                        
                        // Neve no topo
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.beginPath();
                        ctx.moveTo(cx - s * 0.25, cy - s * 0.75);
                        ctx.quadraticCurveTo(cx - s * 0.1, cy - s * 0.88, cx, cy - s * 0.9);
                        ctx.quadraticCurveTo(cx + s * 0.1, cy - s * 0.88, cx + s * 0.25, cy - s * 0.75);
                        ctx.fill();

                        // Fumaça
                        for (let i = 0; i < 5; i++) {
                            const ox = (Date.now() * 0.0001 + i * 0.3) % 60 - 30;
                            const alpha = 0.06 - i * 0.01;
                            ctx.fillStyle = `rgba(150,150,150,${alpha})`;
                            ctx.beginPath();
                            ctx.arc(cx + ox + Math.sin(Date.now() * 0.0005 + i) * 5, 
                                cy - s * 0.8 - 20 - i * 20 + Math.sin(Date.now() * 0.0007 + i * 0.5) * 5, 
                                25 + i * 10, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        // Brilho da lava no topo
                        const glow = ctx.createRadialGradient(cx, cy - s * 0.85, 5, cx, cy - s * 0.85, 40);
                        glow.addColorStop(0, 'rgba(255,100,0,0.3)');
                        glow.addColorStop(0.5, 'rgba(255,50,0,0.1)');
                        glow.addColorStop(1, 'rgba(255,50,0,0)');
                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(cx, cy - s * 0.85, 40, 0, Math.PI * 2);
                        ctx.fill();
                    };

                    drawVolcanoBg(450, GY - 50, 130);

                    // ---- CHÃO ROCHOSO ----
                    const rockGrad = ctx.createLinearGradient(0, GY, 0, H);
                    rockGrad.addColorStop(0, '#3a2a1a');
                    rockGrad.addColorStop(0.3, '#2a1a0a');
                    rockGrad.addColorStop(0.7, '#1a0a0a');
                    rockGrad.addColorStop(1, '#0a0000');
                    ctx.fillStyle = rockGrad;
                    ctx.fillRect(0, GY + 4, W, H - GY);

                    // Rachaduras
                    ctx.strokeStyle = 'rgba(60,40,20,0.3)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 20; i++) {
                        const x = Math.random() * W;
                        const y = GY + 8 + Math.random() * (H - GY - 16);
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + 5 + Math.random() * 15, y + 3 + Math.random() * 8);
                        ctx.stroke();
                    }

                    // ---- LAVA ----
                    const drawLavaFlow = (x, y, w, h) => {
                        const pulse = Math.sin(Date.now() * 0.002 + x) * 2;
                        const grad = ctx.createRadialGradient(x + w/2, y + h/2, 2, x + w/2, y + h/2, w/2);

        // --- AUDIO ---
        class AudioManager {
            constructor() {
                this.enabled = true;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    this.enabled = false;
                }
            }

            playHit() {
                if (!this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + 0.1);
                } catch (e) {}
            }

            playSpecial() {
                if (!this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch (e) {}
            }

            playVictory() {
                if (!this.enabled) return;
                try {
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.15 + 0.2);
                        osc.start(this.ctx.currentTime + i * 0.15);
                        osc.stop(this.ctx.currentTime + i * 0.15 + 0.2);
                    });
                } catch (e) {}
            }
        }

        function spawnParticles(x, y, color, count = 15, speed = 5, size = 5) {
            for (let i = 0; i < count; i++) {

                particles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s - 2,
                    life: 20 + Math.random() * 30,
                    maxLife: 50,
                    size: 2 + Math.random() * size,
                    color: color || '#ffdd44',
                    gravity: 0.1

        // --- APPLY DAMAGE ---
        function applyDamage(attacker, defender, isP1, isSpecial = false) {
            if (defender.hitCooldown > 0 || gameOver) return false;

            const range = isSpecial ? attacker.range * 1.6 : attacker.range;
            const ax = attacker.direction === 1 ? attacker.x + attacker.w : attacker.x - range;
            const bx = { x: defender.x + 4, y: defender.y + 6, w: defender.w - 8, h: defender.h - 14 };
            const pb = { x: ax, y: attacker.y + 4, w: range, h: attacker.h - 12 };

            if (!rectCollide(pb, bx)) return false;

            const dmg = isSpecial ? attacker.specialDamage : (attacker.damage + Math.floor(Math.random() * 4));
            defender.health = Math.max(0, defender.health - Math.min(dmg, defender.health));
            defender.hitCooldown = isSpecial ? 22 : 16;
            defender.hitEffectTimer = 10;
            defender.expression = 'hurt';
            defender.expressionTimer = 15;

            const hx = defender.x + defender.w / 2;
            const hy = defender.y + defender.h / 2;

            if (isSpecial) {
                spawnExplosion(hx, hy);
                spawnTextEffect(hx, hy - 30, '💥 SUPER!', '#ff6b00', 40);
            } else {
                spawnParticles(hx, hy, '#ffdd44', 15, 6);
                spawnTextEffect(hx, hy - 20, '-' + dmg, '#ff4444', 25);
                audio.playHit();
            }

            const push = isSpecial ? 55 : 30;
            defender.x += (isP1 ? 1 : -1) * push;
            defender.x = Math.max(10, Math.min(W - defender.w - 10, defender.x));

            const now = Date.now();
            if (now - attacker.lastHitTime < 2000) comboCount++;
            else comboCount = 1;
            attacker.lastHitTime = now;
            comboTimer = 70;

            if (comboCount >= 2) showCombo(comboCount);

            attacker.special = Math.min(attacker.maxSpecial, attacker.special + (isSpecial ? 2 : 8));
            defender.special = Math.min(defender.maxSpecial, defender.special + 3);
            updateHUD();

            if (defender.health <= 0) {
                gameOver = true;
                winner = isP1 ? 'p1' : 'p2';
                spawnExplosion(defender.x + defender.w / 2, defender.y + defender.h / 2);
                spawnTextEffect(W / 2, H / 2 - 80, '🏆 K.O.!', '#f7d44a', 60);
                updateHUD();
                if (typeof onBotFightEnd === 'function') onBotFightEnd();
            }
            return true;
        }

        const BOT_MAX_LEVEL = 5;

        const BOT_LEVELS = {
            1: { thinkEvery: 18, reactDelay: 20, attackProb: 0.10, specialProb: 0.06, jumpProb: 0.03, retreatProb: 0.16, punishProb: 0.06, approachGap: 52, moveDuty: 0.42 },
            2: { thinkEvery: 12, reactDelay: 13, attackProb: 0.20, specialProb: 0.12, jumpProb: 0.07, retreatProb: 0.22, punishProb: 0.18, approachGap: 38, moveDuty: 0.68 },
            3: { thinkEvery: 8,  reactDelay: 7,  attackProb: 0.32, specialProb: 0.22, jumpProb: 0.11, retreatProb: 0.28, punishProb: 0.36, approachGap: 28, moveDuty: 0.84 },
            4: { thinkEvery: 5,  reactDelay: 3,  attackProb: 0.46, specialProb: 0.32, jumpProb: 0.15, retreatProb: 0.34, punishProb: 0.55, approachGap: 20, moveDuty: 0.94 },
            5: { thinkEvery: 3,  reactDelay: 1,  attackProb: 0.60, specialProb: 0.42, jumpProb: 0.18, retreatProb: 0.40, punishProb: 0.80, approachGap: 14, moveDuty: 1.00 }

        const botModeBtn = document.getElementById('botModeBtn');
        const botLevelLabel = document.getElementById('botLevelLabel');

        function getBotProfile() {
            const lvl = Math.max(1, Math.min(BOT_MAX_LEVEL, botLevel));
            return BOT_LEVELS[lvl] || BOT_LEVELS[1];
        }

        function refreshBotLevelLabel() {
            if (!botLevelLabel) return;
            botLevelLabel.textContent = 'Nv. ' + botLevel + ' / ' + BOT_MAX_LEVEL;

            keys.l = false;

        function resetBotThink() {
            botAI.thinkTimer = 0;
            botAI.reactTimer = 0;
            botAI.sawPunch = false;
            botAI.wantLeft = false;
            botAI.wantRight = false;
            botAI.wantJump = false;
            botAI.wantPunch = false;

        function applyBotFightLabels() {
            if (!vsBot || !selectedP2) return;

                winnerDisplay.textContent = '🤖 BOT Nv.' + botLevel;

        function onBotFightEnd() {
            if (!vsBot) return;
            clearBotKeys();
            if (winner === 'p1' && botLevel < BOT_MAX_LEVEL) {
                botLevel += 1;
                spawnTextEffect(W / 2, H / 2 - 20, 'BOT Nv. ' + botLevel, '#f7d44a', 28);
            }
            refreshBotLevelLabel();
        }

        function botDecide() {
            const cfg = getBotProfile();
            const dist = p2.x - p1.x;
            const absDist = Math.abs(dist);
            const range = (p2.range || 25) * 1.15;
            const inRange = absDist < range + p2.w * 0.35;
            const incoming = p1.punching && absDist < (p1.range || 28) + p1.w * 0.55 + 18;
            const canPunish = p1.cooldown > 6 && p1.cooldown < 14 && absDist < range + 40;

            botAI.wantLeft = false;
            botAI.wantRight = false;
            botAI.wantJump = false;
            botAI.wantPunch = false;
            botAI.wantSpecial = false;

            if (incoming && !botAI.sawPunch) {
                botAI.sawPunch = true;
                botAI.reactTimer = cfg.reactDelay;
            }

            if (botAI.sawPunch && botAI.reactTimer > 0) {
                botAI.reactTimer--;
                if (botAI.reactTimer <= 0) {
                    botAI.sawPunch = false;
                    if (Math.random() < cfg.retreatProb) {
                        if (dist > 0) botAI.wantRight = true;
                        else botAI.wantLeft = true;
                    }
                    if (Math.random() < cfg.jumpProb + cfg.retreatProb * 0.35) {
                        botAI.wantJump = true;
                    }
                }
                return;
            }

            if (canPunish && Math.random() < cfg.punishProb) {
                if (dist > 0) botAI.wantLeft = true;
                else botAI.wantRight = true;
                botAI.wantPunch = true;
                if (p2.special >= SPECIAL_COST && Math.random() < cfg.specialProb + 0.2) {
                    botAI.wantSpecial = true;
                }
                return;
            }

            if (absDist > cfg.approachGap) {
                if (dist > 0) botAI.wantLeft = true;
                else botAI.wantRight = true;
                if (Math.random() < cfg.jumpProb * 0.4) botAI.wantJump = true;
                return;
            }

            if (inRange) {
                if (p2.special >= SPECIAL_COST && Math.random() < cfg.specialProb) {
                    botAI.wantSpecial = true;
                } else if (Math.random() < cfg.attackProb) {
                    botAI.wantPunch = true;
                }
                if (Math.random() < 0.12) {
                    if (dist > 0) botAI.wantRight = true;
                    else botAI.wantLeft = true;
                }
                return;
            }

            if (dist > 0) botAI.wantLeft = true;
            else botAI.wantRight = true;
        }

        function updateBotAI() {
            if (!vsBot || !p1 || !p2 || gameOver) return;

            const cfg = getBotProfile();
            botAI.thinkTimer++;
            if (botAI.thinkTimer >= cfg.thinkEvery) {
                botAI.thinkTimer = 0;
                botDecide();
            }

            clearBotKeys();
            if (Math.random() <= cfg.moveDuty) {
                if (botAI.wantLeft) keys.left = true;
                if (botAI.wantRight) keys.right = true;
            }
            if (botAI.wantJump) keys.up = true;
            if (botAI.wantPunch) keys.l = true;
            if (botAI.wantSpecial) keys.ç = true;
        }

        if (botModeBtn) {
            botModeBtn.addEventListener('click', () => {
                vsBot = !vsBot;
                refreshBotLevelLabel();
                if (vsBot) {
                    selectInstruction.textContent = '✦ VS BOT — PLAYER 1, CHOOSE YOUR CHAMPION ✦';
                } else {
                    selectInstruction.textContent = '✦ PLAYER 1, CHOOSE YOUR CHAMPION ✦';
                    clearBotKeys();
                }
            });
        }
        refreshBotLevelLabel();

        // --- UPDATE ---
        function update() {
            if (!gameStarted || gameOver || !p1 || !p2) return;
            if (typeof updateBotAI === 'function') updateBotAI();

            frameCount++;
            const GY = STAGES[selectedStage].groundY || 355;

            [p1, p2].forEach(p => {
                p.breathPhase += 0.03;
                p.animTimer++;
                if (p.animTimer > 8) {
                    p.animTimer = 0;
                    p.animFrame = (p.animFrame + 1) % 4;
                }
                if (p.hitCooldown > 0) p.hitCooldown--;
                if (p.cooldown > 0) p.cooldown--;
                if (p.punchTimer > 0) p.punchTimer--;
                if (p.punchTimer === 0 && p.punching) p.punching = false;
                if (p.hitEffectTimer > 0) p.hitEffectTimer--;
                if (p.expressionTimer > 0) {
                    p.expressionTimer--;
                    if (p.expressionTimer === 0) p.expression = 'neutral';
                }
            });

            if (comboTimer > 0 && --comboTimer === 0) {
                comboCount = 0;
                comboDisplay.style.opacity = '0';
            }

            // Jump
            if (keys.w && p1.onGround && !gameOver) {
                p1.vy = p1.jumpPower;
                p1.onGround = false;
                p1.isJumping = true;
                spawnParticles(p1.x + p1.w / 2, p1.y + p1.h, '#88ccff', 8, 3);
            }
            if (keys.up && p2.onGround && !gameOver) {
                p2.vy = p2.jumpPower;
                p2.onGround = false;
                p2.isJumping = true;
                spawnParticles(p2.x + p2.w / 2, p2.y + p2.h, '#88ccff', 8, 3);
            }

            // Gravity
            [p1, p2].forEach(p => {
                p.vy += GRAVITY;
                p.y += p.vy;
                if (p.y >= GY - p.h) {
                    p.y = GY - p.h;
                    p.vy = 0;
                    p.onGround = true;
                    p.isJumping = false;
                }
                if (frameCount % 2 === 0 && Math.abs(p.vy) > 1) {
                    p.trail.push({ x: p.x + p.w / 2, y: p.y + p.h, life: 12 });
                }
                p.trail = p.trail.filter(t => --t.life > 0);
            });

            // Movement
            if (keys.a && p1.x > 6) { p1.x -= p1.speed; p1.direction = -1; }
            if (keys.d && p1.x < W - p1.w - 6) { p1.x += p1.speed; p1.direction = 1; }
            if (keys.left && p2.x > 6) { p2.x -= p2.speed; p2.direction = -1; }
            if (keys.right && p2.x < W - p2.w - 6) { p2.x += p2.speed; p2.direction = 1; }

            // Punches
            if (keys.j && !p1.punching && p1.cooldown === 0 && !gameOver) {
                p1.punching = true;
                p1.punchTimer = PUNCH_DURATION;
                p1.cooldown = PUNCH_COOLDOWN;
                applyDamage(p1, p2, true, false);
            }
            if (keys.l && !p2.punching && p2.cooldown === 0 && !gameOver) {
                p2.punching = true;
                p2.punchTimer = PUNCH_DURATION;
                p2.cooldown = PUNCH_COOLDOWN;
                applyDamage(p2, p1, false, false);
            }

            // Specials
            if (keys.k && p1.special >= SPECIAL_COST && !gameOver) {
                p1.special -= SPECIAL_COST;
                p1.punching = true;
                p1.punchTimer = PUNCH_DURATION + 8;
                p1.cooldown = PUNCH_COOLDOWN + 4;
                spawnExplosion(p1.x + (p1.direction === 1 ? p1.w : 0), p1.y + p1.h / 2);
                applyDamage(p1, p2, true, true);
                updateHUD();
                specialP1.classList.remove('full');
            }
            if (keys.ç && p2.special >= SPECIAL_COST && !gameOver) {
                p2.special -= SPECIAL_COST;
                p2.punching = true;
                p2.punchTimer = PUNCH_DURATION + 8;
                p2.cooldown = PUNCH_COOLDOWN + 4;
                spawnExplosion(p2.x + (p2.direction === -1 ? 0 : p2.w), p2.y + p2.h / 2);
                applyDamage(p2, p1, false, true);
                updateHUD();
                specialP2.classList.remove('full');
            }

            // Body collision
            if (rectCollide(p1, p2)) {
                if (p1.x < p2.x) { p1.x -= 4; p2.x += 4; }
                else { p1.x += 4; p2.x -= 4; }
                p1.x = Math.max(6, Math.min(W - p1.w - 6, p1.x));
                p2.x = Math.max(6, Math.min(W - p2.w - 6, p2.x));
            }

            // Passive special gain
            if (!gameOver) {
                p1.special = Math.min(p1.maxSpecial, p1.special + 0.15);
                p2.special = Math.min(p2.maxSpecial, p2.special + 0.15);
            }

            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += (p.gravity || 0.1);
                return --p.life > 0;
            });
            hitSparks = hitSparks.filter(s => --s.life > 0);
            textEffects = textEffects.filter(t => {
                t.y += t.vy;
                t.life--;
                t.alpha = t.life / t.maxLife;
                return t.life > 0;
            });

            if (shakeAmount > 0) shakeAmount *= 0.92;
            if (shakeAmount < 0.1) shakeAmount = 0;

            updateHUD();
        }

        // ============================================================
        // DRAW FIGHTER
        // ============================================================

        function drawFighter(f) {
            if (!f) return;
            const x = f.x, y = f.y, w = f.w, h = f.h, d = f.direction;
            const GY = STAGES[selectedStage].groundY || 355;
            const breath = Math.sin(f.breathPhase) * 0.6;

            ctx.save();

            // Ground shadow — unique width per silhouette
            const shadowW = f.charKey === 'samurai' ? 28 : f.charKey === 'wrestler' ? 26 : f.charKey === 'ninja' ? 18 : 22;
            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            ctx.beginPath();
            ctx.ellipse(x + w / 2, GY + 6, shadowW, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Flip so every fighter is authored facing right
            ctx.translate(x + w / 2, 0);
            ctx.scale(d, 1);
            ctx.translate(-(x + w / 2), 0);

            if (f.hitEffectTimer > 0 && f.hitEffectTimer % 4 < 2) {
                ctx.shadowColor = '#ffffffaa';
                ctx.shadowBlur = 50;
            }

            switch (f.charKey) {
                case 'boxer': drawBoxer(f, x, y, w, h, breath); break;
                case 'ninja': drawNinja(f, x, y, w, h, breath); break;
                case 'samurai': drawSamurai(f, x, y, w, h, breath); break;
                case 'wrestler': drawLutador(f, x, y, w, h, breath); break;
                case 'cyborg': drawCyborg(f, x, y, w, h, breath); break;
                default: drawBoxer(f, x, y, w, h, breath);
            }

            // Special-ready aura
            if (f.special >= SPECIAL_COST) {
                const pulse = Math.sin(frameCount * 0.05) * 0.3 + 0.7;
                ctx.shadowBlur = 50;
                ctx.shadowColor = `rgba(247,212,74,${0.22 * pulse})`;
                ctx.strokeStyle = `rgba(247,212,74,${0.18 * pulse})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x - 7, y - 10, w + 14, h + 16, 16);
                ctx.stroke();
            }

            ctx.restore();
        }

        function rr(x, y, w, h, r) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fill();
        }

        function ellipse(x, y, rx, ry) {
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function strokeEllipse(x, y, rx, ry) {
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        // ============================================================
        // BOXER — modern pro, shirtless trunks, wrapped fists, fade
        // ============================================================
        function drawBoxer(f, x, y, w, h, breath) {
            const punch = f.punching ? 17 : 0;

            const skin = f.skin;
            const cx = x + w / 2;

            rr(x + w - 16, y + 68 + jump, 13, 7, 3);

            ctx.fillRect(x + 5, y + 70 + jump, 12, 1.2);
            ctx.fillRect(x + w - 15, y + 70 + jump, 11, 1.2);
            ctx.fillStyle = '#2c2c2c';
            ctx.fillRect(x + 6, y + 72.5 + jump, 10, 2);
            ctx.fillRect(x + w - 14, y + 72.5 + jump, 9, 2);
            // laces
            ctx.strokeStyle = '#e8e0d0';
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 68.5 + jump); ctx.lineTo(x + 14, y + 68.5 + jump);
            ctx.moveTo(x + 8, y + 70 + jump); ctx.lineTo(x + 14, y + 70 + jump);

            // ----- LEGS -----

            rr(x + 7, y + 56 + jump, 9, 13 - jump, 3);
            rr(x + w - 16, y + 56 + jump, 9, 13 - jump, 3);
            // knee highlight
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ellipse(x + 11.5, y + 62 + jump, 3, 2);
            ellipse(x + w - 11.5, y + 62 + jump, 3, 2);

            // ----- TRUNKS -----
            const trunks = ctx.createLinearGradient(x, y + 46, x, y + 62);
            trunks.addColorStop(0, '#1c4e8a');
            trunks.addColorStop(0.45, '#163d6d');
            trunks.addColorStop(1, '#0d2a4a');
            ctx.fillStyle = trunks;
            rr(x + 5, y + 46 + breath * 0.3, w - 10, 16, 4);
            // waistband
            ctx.fillStyle = '#f4e4b0';
            rr(x + 5, y + 46 + breath * 0.3, w - 10, 4, 2);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x + 6, y + 47.2 + breath * 0.3, w - 12, 1.4);

            ctx.fillStyle = '#f1c40f';

            // tiny brand mark
            ctx.fillStyle = 'rgba(241,196,15,0.7)';
            ctx.font = 'bold 5px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('★', cx, y + 58 + breath * 0.3);

            // ----- TORSO (shirtless, athletic) -----
            const bodyG = ctx.createLinearGradient(x + 8, y + 24, x + w - 8, y + 48);
            bodyG.addColorStop(0, lightenColor(skin.head, 12));
            bodyG.addColorStop(0.5, skin.head);
            bodyG.addColorStop(1, darkenColor(skin.head, 18));
            ctx.fillStyle = bodyG;
            rr(x + 8, y + 24 + breath, w - 16, 24, 5);
            // pecs
            ctx.fillStyle = 'rgba(120,70,40,0.12)';
            ellipse(cx - 6, y + 32 + breath, 6, 3.5);
            ellipse(cx + 6, y + 32 + breath, 6, 3.5);
            // abs
            ctx.strokeStyle = 'rgba(90,50,30,0.18)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(cx, y + 36 + breath); ctx.lineTo(cx, y + 46 + breath);
            ctx.moveTo(cx - 4, y + 39 + breath); ctx.lineTo(cx + 4, y + 39 + breath);
            ctx.moveTo(cx - 4, y + 43 + breath); ctx.lineTo(cx + 4, y + 43 + breath);
            ctx.stroke();
            // collarbone
            ctx.beginPath();
            ctx.moveTo(x + 11, y + 27 + breath);
            ctx.quadraticCurveTo(cx, y + 25 + breath, x + w - 11, y + 27 + breath);
            ctx.stroke();

            // ----- BACK ARM -----
            ctx.fillStyle = skin.head;
            rr(x + 3, y + 26 + breath, 6, 16, 3);
            // rear wrap
            ctx.fillStyle = '#d9c7a2';
            rr(x + 2.5, y + 38 + breath, 7, 6, 2);
            ctx.strokeStyle = 'rgba(90,70,40,0.35)';
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(x + 3, y + 40 + breath); ctx.lineTo(x + 9, y + 40 + breath);
            ctx.moveTo(x + 3, y + 42 + breath); ctx.lineTo(x + 9, y + 42 + breath);
            ctx.stroke();
            // rear glove (smaller)
            const bgx = x + 6, bgy = y + 42 + breath;
            ctx.fillStyle = '#c62828';
            ellipse(bgx, bgy + 4, 7.5, 7);

            // ----- FRONT ARM + WRAPS -----
            const armX = x + w - 10 + punch;
            ctx.fillStyle = skin.head;
            rr(armX, y + 22 + breath, 8, 18, 3);
            ctx.fillStyle = '#e6d3b0';
            rr(armX - 1, y + 36 + breath, 10, 8, 2);
            ctx.strokeStyle = 'rgba(90,70,40,0.4)';
            ctx.lineWidth = 0.7;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(armX - 0.5, y + 37.5 + breath + i * 1.6);
                ctx.lineTo(armX + 8.5, y + 37.5 + breath + i * 1.6);

            // ----- PRO GLOVE -----
            const gx = x + w - 2 + punch;
            const gy = y + 28 + breath + (f.punching ? -5 : 0);
            const gGrad = ctx.createRadialGradient(gx - 5, gy - 5, 3, gx, gy, 16);
            gGrad.addColorStop(0, '#ff6b6b');

            gGrad.addColorStop(1, '#8e1c28');
            ctx.fillStyle = gGrad;
            ellipse(gx, gy, 13.5, 12.5);
            // wrist cuff
            ctx.fillStyle = '#1a1a1a';
            rr(gx - 9, gy + 6, 14, 6, 2);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(gx - 8, gy + 7.5, 12, 1.4);
            // knuckle rolls
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            for (let i = 0; i < 4; i++) ellipse(gx - 6 + i * 4.2, gy - 3, 1.6, 3.2);
            // logo

            ellipse(gx + 3, gy + 1, 3, 3);

            // ----- NECK -----
            ctx.fillStyle = darkenColor(skin.head, 8);
            rr(cx - 5, y + 20 + breath, 10, 7, 3);

            // ----- HEAD -----
            const hg = ctx.createRadialGradient(cx - 5, y + 8 + breath, 3, cx, y + 13 + breath, 18);
            hg.addColorStop(0, lightenColor(skin.head, 28));
            hg.addColorStop(0.7, skin.head);
            hg.addColorStop(1, darkenColor(skin.head, 14));
            ctx.fillStyle = hg;
            ellipse(cx, y + 13 + breath, 16, 18);

            // fade haircut
            ctx.fillStyle = '#2a1810';
            ctx.beginPath();
            ctx.ellipse(cx - 1, y + 4 + breath, 15, 10, 0, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#1a0e08';
            ctx.beginPath();
            ctx.ellipse(cx - 1, y + 2.5 + breath, 12, 6.5, 0, Math.PI, 0);
            ctx.fill();
            // side fade

            ellipse(cx - 14, y + 12 + breath, 3, 8);
            ellipse(cx + 13, y + 12 + breath, 3, 8);

            // brow scar
            ctx.strokeStyle = 'rgba(140,60,50,0.55)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(cx + 4, y + 9 + breath);
            ctx.lineTo(cx + 9, y + 11 + breath);
            ctx.stroke();

            // brows
            ctx.strokeStyle = hurt ? '#8b1a1a' : '#1a0e08';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            if (hurt) {
                ctx.moveTo(cx + 2, y + 11 + breath); ctx.lineTo(cx + 12, y + 13 + breath);
            } else {
                ctx.moveTo(cx + 2, y + 10 + breath); ctx.lineTo(cx + 12, y + 9.5 + breath);
            }
            ctx.stroke();

            // eye
            const eyeX = cx + 7, eyeY = y + 14 + breath + (hurt ? 1 : 0);
            ctx.fillStyle = '#f8fbff';
            ellipse(eyeX, eyeY, 4.6, 4);
            ctx.fillStyle = hurt ? '#6b0000' : '#1a1520';
            ellipse(eyeX + 1.4, eyeY, 2.6, 2.6);
            ctx.fillStyle = '#fff';
            ellipse(eyeX + 2.2, eyeY - 1.4, 1.2, 1.2);

            // nose
            ctx.strokeStyle = 'rgba(90,50,30,0.35)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(cx + 2, y + 15 + breath);
            ctx.lineTo(cx + 5, y + 19 + breath);
            ctx.stroke();

            // mouth — determined / grit
            ctx.strokeStyle = 'rgba(80,40,30,0.55)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            if (hurt) {
                ctx.arc(cx + 3, y + 23 + breath, 3.5, 0.15, Math.PI - 0.15);
            } else {
                ctx.moveTo(cx + 1, y + 22 + breath);
                ctx.lineTo(cx + 7, y + 22.5 + breath);
            }
            ctx.stroke();

            // jaw line
            ctx.strokeStyle = 'rgba(80,40,20,0.2)';

            ctx.beginPath();
            ctx.moveTo(cx - 8, y + 22 + breath);

        }

        // ============================================================
        // NINJA — layered shinobi, masked, slim, tabi, sash
        // ============================================================
        function drawNinja(f, x, y, w, h, breath) {
            const punch = f.punching ? 16 : 0;
            const jump = f.isJumping ? 4 : 0;
            const hurt = f.expression === 'hurt';
            const cx = x + w / 2;
            const sway = Math.sin(f.breathPhase * 0.7) * 2;

            // ----- TABI -----
            ctx.fillStyle = '#0d0d12';
            rr(x + 6, y + 69 + jump, 11, 5, 2);
            rr(x + w - 16, y + 69 + jump, 11, 5, 2);
            ctx.fillStyle = '#1a1a22';
            ctx.fillRect(x + 10, y + 69 + jump, 1.2, 5);
            ctx.fillRect(x + w - 12, y + 69 + jump, 1.2, 5);

            // ----- HAKAMA / layered pants -----
            const pan = ctx.createLinearGradient(x, y + 48, x, y + 72);
            pan.addColorStop(0, '#16161f');
            pan.addColorStop(1, '#0a0a10');
            ctx.fillStyle = pan;
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 50 + breath);
            ctx.lineTo(x + 4, y + 71 + jump);
            ctx.lineTo(x + 18, y + 71 + jump);
            ctx.lineTo(cx + 1, y + 52 + breath);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx - 1, y + 52 + breath);
            ctx.lineTo(x + w - 18, y + 71 + jump);
            ctx.lineTo(x + w - 4, y + 71 + jump);
            ctx.lineTo(x + w - 8, y + 50 + breath);
            ctx.closePath();
            ctx.fill();
            // panel seams
            ctx.strokeStyle = 'rgba(180,40,50,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + 11, y + 52); ctx.lineTo(x + 8, y + 70);
            ctx.moveTo(x + w - 11, y + 52); ctx.lineTo(x + w - 8, y + 70);
            ctx.stroke();

            // ----- TORSO wrap / layered gi -----
